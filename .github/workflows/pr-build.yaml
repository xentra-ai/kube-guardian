  # Build Supplychain. One job for both platforms: the Dockerfile
  # cross-compiles static Go on the build platform and the runtime stage has
  # no RUN steps, so arm64 needs neither QEMU nor an arm64 runner.
  build-supplychain:
    runs-on: ubuntu-latest
    needs: [detect-changes, test-supplychain]
    if: needs.detect-changes.outputs.supplychain == 'true'
    concurrency:
      group: pr-build-${{ github.event.pull_request.number }}-build-supplychain
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
