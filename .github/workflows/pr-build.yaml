  # Evaluator (Go): vet and test. Path-filtered like every component here;
  # the concurrency group cancels a superseded run for the same PR (only
  # when the newer run also runs this job). GOTOOLCHAIN=local makes a
  # go.mod that outruns the installed Go fail loudly instead of downloading
  # a toolchain; go-version-file keeps setup-go in step with go.mod.
  test-evaluator:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.evaluator == 'true'
    permissions:
      contents: read
    concurrency:
      group: pr-build-${{ github.event.pull_request.number }}-test-evaluator
      cancel-in-progress: true
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: evaluator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: evaluator/go.mod
          cache-dependency-path: evaluator/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0 # pinned; bump deliberately (a new release can add failing linters)
          working-directory: evaluator
          args: --timeout=5m

      # A real kube-apiserver + etcd for the tests that need one (the
      # ImageTrustPolicy status test: server-side apply removing stale
      # fields, CRD schema not pruning them). Pinned: setup-envtest from
      # controller-runtime v0.25.1, Kubernetes 1.34.x. Tests skip without
      # KUBEBUILDER_ASSETS, so this step is what makes them run here.
      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.1
          assets="$("$(go env GOPATH)/bin/setup-envtest" use 1.34.x --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          test -x "$assets/kube-apiserver"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"

      - name: go test
        run: go test -race -count=1 ./...

      # Name the real API server tests in the log and fail unless each
      # passed: a test that silently skips reads as green otherwise (#1690).
      # pipefail: a failing go test fails the step even though tee succeeds.
      # grep without -q prints the matched PASS line into the log.
      - name: envtest (named)
        run: |
          set -o pipefail
          go test -count=1 -v -run '^TestStatusAgainstARealAPIServer$' ./pkg/imagetrust | tee envtest.log
          grep -- '--- PASS: TestStatusAgainstARealAPIServer' envtest.log
          go test -count=1 -v -run '^TestStatusHidesBrokerAddressOnARealAPIServer$' ./pkg/appprofile | tee envtest-appprofile.log
          grep -- '--- PASS: TestStatusHidesBrokerAddressOnARealAPIServer' envtest-appprofile.log

