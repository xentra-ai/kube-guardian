---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build PR Docker Images

on:
  pull_request:
    branches:
      - main
    paths:
      - 'controller/**'
      - 'broker/**'
      - 'frontend/**'
      - 'llm-bridge/**'
      - 'evaluator/**'
      - 'supplychain/**'
      - 'supplychain-matcher/**'
      - 'cataloger/**'
      - 'charts/**'
      - 'test/fixtures/**'
      - '.github/workflows/pr-build.yaml'

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # Detect which components changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      controller: ${{ steps.changes.outputs.controller }}
      broker: ${{ steps.changes.outputs.broker }}
      frontend: ${{ steps.changes.outputs.frontend }}
      llm-bridge: ${{ steps.changes.outputs.llm-bridge }}
      evaluator: ${{ steps.changes.outputs.evaluator }}
      supplychain: ${{ steps.changes.outputs.supplychain }}
      supplychain-matcher: ${{ steps.changes.outputs.supplychain-matcher }}
      cataloger: ${{ steps.changes.outputs.cataloger }}
      charts: ${{ steps.changes.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2  # Fetch enough history to compare with previous commit

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          # Compare HEAD with previous commit (HEAD~1) to only detect changes in latest push
          base: HEAD~1
          filters: |
            controller:
              - 'controller/**'
              # The controller's build and test jobs are defined here, so a
              # change to this file has to re-run them: otherwise an edit to
              # how the controller is built ships without that build ever
              # running. Same reason the supplychain filters below list it.
              - '.github/workflows/pr-build.yaml'
            broker:
              - 'broker/**'
              # The broker's NetworkPolicy generator (broker/src/netpol) is
              # held to the shared goldens, like the advisor, frontend and
              # llm-bridge copies: a golden change must re-run its tests.
              - 'test/fixtures/generators/networkpolicy/**'
            frontend:
              - 'frontend/**'
              - 'test/fixtures/generators/**'
            llm-bridge:
              - 'llm-bridge/**'
              - 'test/fixtures/**'
            evaluator:
              - 'evaluator/**'
            supplychain-matcher:
              - 'supplychain-matcher/**'
              - '.github/workflows/pr-build.yaml'
            # The matcher's go.mod decides the Syft version the cataloger
            # must match (hack/check-syft-version.sh), so a Grype bump
            # re-runs the cataloger's checks too.
            cataloger:
              - 'cataloger/**'
              - 'supplychain-matcher/go.mod'
              - '.github/workflows/pr-build.yaml'
            supplychain:
              - 'supplychain/**'
              - '.github/workflows/pr-build.yaml'
            charts:
              - 'charts/**'

  # Build Controller
  build-controller:
    needs: detect-changes
    if: needs.detect-changes.outputs.controller == 'true'
    # Each architecture compiles natively, arm64 on GitHub's arm64 runners,
    # the way build-broker already does.
    #
    # This replaced a `cross` build that ran on amd64 for both targets. Three
    # costs came with it, none of them cached: `cargo install cross --git
    # ... --force` rebuilt cross from git HEAD every job (and --force meant
    # the cached ~/.cargo/bin never applied), Cross.toml's pre-build
    # reinstalled the toolchain's apt dependencies and re-downloaded protoc
    # inside the container every job, and a fresh runner never has the custom
    # cross image locally, so none of that was reusable. Native compilation
    # needs only the apt packages below, which is the set test-controller has
    # always built and tested against.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        # Mirrors test-controller and the old Cross.toml pre-build: clang and
        # libelf for the libbpf-cargo build script, plus libseccomp-sys and
        # the protobuf toolchain.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libelf-dev \
            libseccomp-dev \
            libbpf-dev \
            zlib1g-dev \
            pkg-config \
            protobuf-compiler

      - name: Install Rust stable
        # The nightly toolchain this job used to install first (with miri and
        # rust-src) was immediately overridden by stable and never used: there
        # is no rust-toolchain.toml and no nightly feature in the crate.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        # Replaces actions/cache over a raw controller/target/. That was never
        # pruned, so a release profile over ~400 crates across two targets grew
        # without bound toward the 10 GB per-repository cache limit and evicted
        # the buildx caches the other jobs depend on. rust-cache prunes stale
        # artifacts, skips the workspace crate's own output (which is rebuilt
        # every run regardless, so storing it is pure upload cost), and keys on
        # the toolchain and lockfile automatically. The old key also hashed
        # **/Cargo.lock, so a broker dependency bump discarded the controller's
        # cache, and its last restore-key was shared across both matrix legs.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: controller -> target
          key: ${{ matrix.target }}

      - name: Build Rust
        working-directory: controller
        run: cargo build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}-binary
          path: controller/target/${{ matrix.target }}/release/kguardian
          retention-days: 7

  push-controller:
    runs-on: ubuntu-latest
    needs: build-controller
    # Fork PRs cannot push packages or comment (read-only GITHUB_TOKEN);
    # build-controller has already validated the binaries there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          install: true
          version: latest

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: x86_64-unknown-linux-gnu-binary
          path: controller/linux/amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aarch64-unknown-linux-gnu-binary
          path: controller/linux/arm64

      - name: Build and Push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: controller/
          platforms: linux/amd64,linux/arm64
          file: controller/Dockerfile
          push: true
          tags: |
            ghcr.io/kguardian-dev/kguardian/controller:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update or create PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '✅ Controller image built and pushed:';
            const digest = '${{ steps.build.outputs.digest }}';
            const body = `${marker}
            \`\`\`
            ghcr.io/kguardian-dev/kguardian/controller:pr-${Number(process.env.PR_NUMBER)}
            \`\`\`
            **Digest:** \`${digest}\``;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # Lint + test Controller (cargo fmt / clippy / test).
  # Runs in parallel with build-controller and intentionally is NOT a
  # dependency of push-controller or pr-summary — failing tests must not
  # block image publication for downstream PR validation.
  test-controller:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.controller == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        # Mirrors controller/Cross.toml pre-build deps. Needed for the
        # libbpf-cargo build script (clang + libelf), libseccomp-sys and
        # the openssl(vendored)/protobuf toolchain.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libelf-dev \
            libseccomp-dev \
            libbpf-dev \
            zlib1g-dev \
            pkg-config \
            protobuf-compiler

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        # Same reasoning as build-controller: actions/cache never pruned
        # controller/target/, so the debug profile plus every --all-targets
        # test binary grew without bound toward the 10 GB per-repository limit.
        #
        # Deliberately a separate cache from build-controller's, not a
        # shared-key. That job compiles --release for an explicit target
        # triple; this one builds debug for the host. The two write disjoint
        # paths under target/, so one key would mean each job restoring the
        # other's artifacts and racing to save, for no reuse.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: controller -> target
          key: test

      - name: cargo fmt --check
        working-directory: controller
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: controller
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: controller
        # Controller tests are safe under default parallel scheduling.
        run: cargo test --all-features

  # Build Broker
  build-broker:
    needs: detect-changes
    if: needs.detect-changes.outputs.broker == 'true'
    # Both architectures always build on PRs (
    # amd64 + arm64 are a product guarantee at every pipeline stage). Each
    # arch builds natively - arm64 on GitHub's free arm64 runners - instead
    # of under QEMU emulation, which cost up to 45 minutes per component.
    # push-broker merges the two per-arch tags into the pr-N manifest.
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          install: true
          version: latest

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push (per-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: broker/
          file: broker/Dockerfile
          platforms: ${{ matrix.platform }}
          # Fork PRs run with a read-only GITHUB_TOKEN, so pushing the
          # pr-N preview tag is denied. Build (and load locally for the
          # smoke test) instead — the Dockerfile and binary are still
          # fully exercised, only publication is skipped.
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          tags: |
            ghcr.io/kguardian-dev/kguardian/broker:pr-${{ github.event.pull_request.number }}-${{ matrix.arch }}
          cache-from: type=gha,scope=broker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=broker-${{ matrix.arch }}

      # Execute the built image, not just build it. Catches runtime-only
      # failures like builder/runtime glibc mismatch (broker v1.12.0 shipped
      # unable to exec: "GLIBC_2.38 not found"). Runs natively on BOTH
      # architectures now - under the old QEMU flow the arm64 image was
      # never executed in CI at all.
      - name: Smoke test image (binary must exec)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          out=$(docker run --rm "ghcr.io/kguardian-dev/kguardian/broker:pr-${PR_NUMBER}-${{ matrix.arch }}" /broker 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -q "DATABASE_URL must be set"; then
            echo "OK: binary executed to the expected startup assertion"
          else
            echo "FAIL: binary did not reach startup (loader/link error above?)"
            exit 1
          fi

  push-broker:
    runs-on: ubuntu-latest
    needs: build-broker
    # Fork PRs: no per-arch tags were pushed, so there is nothing to merge.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch tags into the pr-N manifest
        id: build
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          img="ghcr.io/kguardian-dev/kguardian/broker"
          docker buildx imagetools create -t "$img:pr-${PR_NUMBER}" \
            "$img:pr-${PR_NUMBER}-amd64" "$img:pr-${PR_NUMBER}-arm64"
          digest=$(docker buildx imagetools inspect "$img:pr-${PR_NUMBER}" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Update or create PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '✅ Broker image built and pushed:';
            const digest = '${{ steps.build.outputs.digest }}';
            const body = `${marker}
            \`\`\`
            ghcr.io/kguardian-dev/kguardian/broker:pr-${Number(process.env.PR_NUMBER)}
            \`\`\`
            **Digest:** \`${digest}\``;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # Lint + test Broker (cargo fmt / clippy / test).
  # Runs in parallel with build-broker and intentionally is NOT a
  # dependency of build-broker or pr-summary — failing tests must not
  # block image publication for downstream PR validation.
  #
  # NOTE: broker/src/audit.rs and broker/src/conn.rs contain unit tests that
  # mutate process env vars (AUDIT_INFLIGHT_PERMITS, AUDIT_EVAL_TIMEOUT_MS,
  # EVALUATOR_URL, DATABASE_URL whitespace) and race under cargo's default
  # parallel scheduler. We pin to a single test thread as a pragmatic
  # mitigation; the proper fix is to migrate those tests to the
  # `serial_test` crate and mark them `#[serial]` (tracked separately).
  test-broker:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.broker == 'true'
    services:
      # The broker's accumulation rules live in raw SQL fragments inside the
      # upsert (count + EXCLUDED.count, LEAST/GREATEST, COALESCE). A unit
      # test can prove the right fragment is SENT; only a database proves it
      # does what it says, and a #[ignore]d test nothing runs proves nothing
      # at all. This is what makes the `--ignored` step below possible.
      #
      # Same major the chart deploys (charts/kguardian/values.yaml pins
      # postgres 18) — but deliberately the glibc image, not the
      # `18-alpine` the chart's in-cluster database defaults to, and with
      # the locale pinned at initdb rather than inherited from the image.
      #
      # musl's strcoll() is strcmp(), so on the alpine image string
      # collation IS byte order. The broker sorts denial rows in the
      # database (`ORDER BY syscall, action`) and truncates the same list
      # in Rust (`BTreeSet<String>`, byte order); any disagreement between
      # those two orders is invisible on a database that cannot disagree.
      # That is not hypothetical — it shipped: on glibc `en_US.UTF-8` the
      # SQL keeps `ioctl` at the cap where Rust keeps `io_uring_enter`,
      # and CI was green throughout. Both images report
      # `datcollate = en_US.utf8`, so the image tag is the only thing that
      # says which behaviour you get.
      #
      # glibc is also what operators run: RDS, Cloud SQL and the official
      # postgres image all default to a libc locale, and
      # `database.sslMode` exists because external managed Postgres is a
      # first-class path in this chart.
      #
      # Not a matrix over both images: under musl the database sorts in
      # exactly the order the Rust side truncates in, so the alpine leg
      # could not go red for this class — it would double the most
      # expensive Rust job to run tests in the one environment where they
      # cannot fail. CI runs the harder of the two.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kguardian
          POSTGRES_PASSWORD: kguardian
          POSTGRES_DB: kguardian
          # Explicit, because the default is a moving target: PostgreSQL 18
          # ships a `builtin` provider whose C.UTF-8 locale is byte order,
          # and a future image picking it up by default would quietly
          # restore the blind spot this job exists to close. The step below
          # asserts the cluster really did come up collation-sensitive.
          POSTGRES_INITDB_ARGS: '--locale-provider=libc --locale=en_US.UTF-8'
        ports:
          - 5432:5432
        # The job runs on the runner, not in a container, so without this
        # the first test can connect before postgres is accepting queries.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Diesel applies pending migrations in version order, so a new one
      # dated before the base branch's newest would run BEFORE it on a fresh
      # database. A new migration directory (present here, absent on the
      # base) must sort after every migration already on the base.
      - name: New broker migrations sort after the base's newest
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base="$(git ls-tree --name-only FETCH_HEAD broker/db/migrations/ | xargs -r -n1 basename | sort)"
          max="$(cut -d_ -f1 <<<"$base" | sort | tail -1)"
          [ -n "$max" ] || { echo "::error::no migrations found on $BASE_REF"; exit 1; }
          echo "base $BASE_REF newest migration: $max"
          checked=0
          for m in $(comm -13 <(echo "$base") <(ls broker/db/migrations | sort)); do
            [[ "${m%%_*}" > "$max" ]] || { echo "::error::migration $m must sort after $max (the base's newest)"; exit 1; }
            echo "OK: $m sorts after $max"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "no new migrations; base newest $max"
          else
            echo "new migrations checked: $checked"
          fi

      - name: Install system dependencies
        # diesel-postgres links against libpq at build time; libpq5 in the
        # runtime Dockerfile is not enough for `cargo test`. psql is for the
        # collation assertion below, and is installed explicitly rather than
        # taken from whatever the runner image happens to preinstall.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpq-dev \
            postgresql-client \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            broker/target/
          key: ${{ runner.os }}-cargo-broker-test-${{ hashFiles('broker/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-broker-test-
            ${{ runner.os }}-cargo-broker-

      - name: cargo fmt --check
        working-directory: broker
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: broker
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: broker
        # See job-level NOTE: env-mutating tests require --test-threads=1.
        run: cargo test --all-features -- --test-threads=1

      - name: Assert the test database sorts by collation, not byte order
        env:
          KG_TEST_DATABASE_URL: postgres://kguardian:kguardian@localhost:5432/kguardian
        # The live tests below can only catch a SQL-order/Rust-order
        # disagreement on a database whose collation differs from byte
        # order. That property comes from the service image and its initdb
        # locale, neither of which fails loudly when it changes — swap the
        # tag back to alpine, or let a future default flip to the builtin
        # C.UTF-8 provider, and every collation-sensitive test goes green
        # for the wrong reason. This is the one check that notices.
        #
        # `ioctl` before `io_uring_enter` is the glibc en_US.UTF-8 answer
        # (punctuation is not weighted at the first level); byte order puts
        # `_` (0x5F) before `c` (0x63) and returns the opposite.
        run: |
          set -euo pipefail
          psql "$KG_TEST_DATABASE_URL" -Atc \
            "SELECT 'collation ' || datcollate || ', provider ' || datlocprovider::text FROM pg_database WHERE datname = current_database()"
          order=$(psql "$KG_TEST_DATABASE_URL" -Atc \
            "SELECT string_agg(s, ',' ORDER BY s) FROM (VALUES ('io_uring_enter'), ('ioctl')) v(s)")
          echo "ORDER BY returns: $order"
          if [ "$order" != "ioctl,io_uring_enter" ]; then
            echo "::error::This Postgres sorts strings in byte order, so the live tests cannot"
            echo "::error::catch a bug where SQL orders by collation and Rust truncates by bytes."
            echo "::error::Check the postgres service image and POSTGRES_INITDB_ARGS in this job."
            exit 1
          fi

      - name: cargo test --ignored (live Postgres)
        working-directory: broker
        env:
          KG_TEST_DATABASE_URL: postgres://kguardian:kguardian@localhost:5432/kguardian
        # Every #[ignore]d test in the crate runs here except the one named
        # in --skip. It used to be the other way round — a `live_database`
        # name filter — which meant an ignored test named anything else ran
        # in no job at all and nothing said so. A deny-list inverts the
        # default: a new live test is picked up whatever it is called, and
        # the way this arrangement breaks (the skipped test gets renamed, so
        # it starts running here) is a visible red, not a silent green.
        #
        # version_check::https_stack_performs_a_real_request is the skipped
        # one: it reaches a third-party host, and a PR gate that fails when
        # someone else's TLS endpoint has a bad day is a gate people learn
        # to ignore.
        #
        # These tests share one database and reset the schema from the real
        # migrations, so --test-threads=1 is required for correctness, not
        # just for the env-var races the job note describes.
        run: |
          cargo test --all-features -- --ignored --test-threads=1 \
            --skip https_stack_performs_a_real_request

