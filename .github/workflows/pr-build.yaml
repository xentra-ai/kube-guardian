  # Supplychain (Go): vet, lint, test. Path-filtered like every component
  # here; the concurrency group cancels a superseded run for the same PR
  # (only when the newer run also runs this job, so a later push that does
  # not touch supplychain never cancels its checks).
  test-supplychain:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.supplychain == 'true'
    permissions:
      contents: read
    concurrency:
      group: pr-build-${{ github.event.pull_request.number }}-test-supplychain
      cancel-in-progress: true
    defaults:
      run:
        working-directory: supplychain
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # go-version-file keeps the toolchain in step with go.mod, so CI can
      # never fall behind the module's go directive (GOTOOLCHAIN=local).
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
