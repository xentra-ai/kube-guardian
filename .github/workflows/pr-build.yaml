      group: pr-build-${{ github.event.pull_request.number }}-build-supplychain-matcher
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          install: true
          version: latest

      - name: Login to GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: supplychain-matcher/
          file: supplychain-matcher/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
          # Read-only token on fork PRs — build without publishing there.
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ghcr.io/kguardian-dev/kguardian/supplychain-matcher:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=supplychain-matcher
          cache-to: type=gha,mode=max,scope=supplychain-matcher

  # Cataloger (Go, embeds Syft): vet, lint, unit tests, the Syft lock-step
  # check against the matcher, and the capability-model tests in
  # containers set up like the worker (hack/privileged-tests.sh). The
  # differential test against Syft's directory source runs in
  # cataloger-difftest.yaml on dependency changes.
  test-cataloger:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.cataloger == 'true'
    permissions:
      contents: read
    concurrency:
      group: pr-build-${{ github.event.pull_request.number }}-test-cataloger
      cancel-in-progress: true
    defaults:
      run:
        working-directory: cataloger
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Syft matches the matcher's
        run: hack/check-syft-version.sh

      # go-version-file keeps the toolchain in step with go.mod, so CI can
      # never fall behind the module's go directive (GOTOOLCHAIN=local).
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cataloger/go.mod
          cache-dependency-path: cataloger/go.sum

      - name: go vet
        run: go vet ./... && go vet -tags difftest ./... && go vet -tags privileged ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0 # pinned; bump deliberately (a new release can add failing linters)
          working-directory: cataloger
          args: --timeout=15m

      # As the runner user: the worker probes model (ii) (no uid change),
      # and every process and protocol test runs against real children.
      - name: go test
        run: go test -race -count=1 ./...

      # Race builds run the scan child without RLIMIT_DATA (ThreadSanitizer
      # maps a large shadow region), so the hard memory limit and the
      # burst-allocation test only run in a normal build.
      - name: go test (no race detector)
        run: CGO_ENABLED=0 go test -count=1 ./internal/sandbox ./internal/server

      # Models (i) and (ii) as the chart will run them: uid 0, cap-drop
      # ALL plus the capabilities under test, no-new-privileges, Docker's
      # default seccomp profile.
      - name: Capability-model tests
        run: hack/privileged-tests.sh

  # Build the Cataloger image. One job for both platforms: the Dockerfile
  # cross-compiles static Go on the build platform and the runtime stage has
  # no RUN steps, so arm64 needs neither QEMU nor an arm64 runner.
  build-cataloger:
    runs-on: ubuntu-latest
    needs: [detect-changes, test-cataloger]
    if: needs.detect-changes.outputs.cataloger == 'true'
    concurrency:
      group: pr-build-${{ github.event.pull_request.number }}-build-cataloger
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          install: true
          version: latest

      - name: Login to GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: cataloger/
          file: cataloger/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
          # Read-only token on fork PRs — build without publishing there.
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ghcr.io/kguardian-dev/kguardian/cataloger:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=cataloger
          cache-to: type=gha,mode=max,scope=cataloger

  # Build and publish Helm chart for PR testing
  build-helm-chart:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.charts == 'true' || needs.detect-changes.outputs.controller == 'true' || needs.detect-changes.outputs.broker == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.llm-bridge == 'true' || needs.detect-changes.outputs.evaluator == 'true' || needs.detect-changes.outputs.supplychain == 'true' || needs.detect-changes.outputs.supplychain-matcher == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: 'latest'

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Chart.yaml with PR version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd charts/kguardian
          # Use PR number as version suffix
          CURRENT_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          PR_VERSION="${CURRENT_VERSION}-pr${PR_NUMBER}"
          sed -i "s/^version:.*/version: ${PR_VERSION}/" Chart.yaml
          echo "Updated chart version to: ${PR_VERSION}"
          cat Chart.yaml | grep version

      - name: Package Helm Chart
        run: |
          cd charts
          helm package kguardian

      # Fork PRs run with a read-only GITHUB_TOKEN: the chart still gets
      # packaged above (validating it), but publication and the PR
      # comment are skipped.
      - name: Push Helm Chart to GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd charts
          CHART_FILE=$(ls kguardian-*.tgz)
          helm push "${CHART_FILE}" oci://ghcr.io/kguardian-dev/charts

      - name: Update or create Helm chart comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '✅ Helm chart built and pushed for testing:';
            const version = Number(process.env.PR_NUMBER);
            const body = marker + '\n```bash\n# Install PR Helm chart\nhelm install kguardian oci://ghcr.io/kguardian-dev/charts/kguardian \\\n  --version $(helm search repo kguardian-dev/kguardian --versions | grep pr' + version + ' | head -1 | awk \'{print $2}\') \\\n  --namespace kguardian \\\n  --create-namespace\n\n# Or upgrade existing installation\nhelm upgrade kguardian oci://ghcr.io/kguardian-dev/charts/kguardian \\\n  --version $(helm search repo kguardian-dev/kguardian --versions | grep pr' + version + ' | head -1 | awk \'{print $2}\') \\\n  --namespace kguardian\n```';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # Summary comment with testing instructions. Skipped on fork PRs: no
  # preview images were published there and the read-only GITHUB_TOKEN
  # cannot create comments anyway.
  pr-summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, push-controller, build-broker, push-broker, build-frontend, push-frontend, build-llm-bridge, push-llm-bridge, build-evaluator, push-evaluator, build-supplychain, build-supplychain-matcher, build-cataloger, build-helm-chart]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Update or create summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '## 🚀 PR Build Summary';
            const controller = '${{ needs.detect-changes.outputs.controller }}' === 'true';
            const broker = '${{ needs.detect-changes.outputs.broker }}' === 'true';
            const frontend = '${{ needs.detect-changes.outputs.frontend }}' === 'true';
            const llmBridge = '${{ needs.detect-changes.outputs.llm-bridge }}' === 'true';
            const evaluator = '${{ needs.detect-changes.outputs.evaluator }}' === 'true';
            const supplychain = '${{ needs.detect-changes.outputs.supplychain }}' === 'true';
            const supplychainMatcher = '${{ needs.detect-changes.outputs.supplychain-matcher }}' === 'true';
            const cataloger = '${{ needs.detect-changes.outputs.cataloger }}' === 'true';
            const charts = '${{ needs.detect-changes.outputs.charts }}' === 'true';
            const helmBuilt = '${{ needs.build-helm-chart.result }}' === 'success';

            let body = marker + '\n\n';

            if (!controller && !broker && !frontend && !llmBridge && !evaluator && !supplychain && !supplychainMatcher && !cataloger && !charts) {
              body += '⏭️ No component changes detected. Skipping builds.\n';
            } else {
              body += '### Built Images\n\n';

              if (controller) {
                body += '✅ **Controller**: `ghcr.io/kguardian-dev/kguardian/controller:pr-' + Number(process.env.PR_NUMBER) + '`\n';
              }
              if (broker) {
                body += '✅ **Broker**: `ghcr.io/kguardian-dev/kguardian/broker:pr-' + Number(process.env.PR_NUMBER) + '`\n';
              }
              if (frontend) {
                body += '✅ **Frontend**: `ghcr.io/kguardian-dev/kguardian/frontend:pr-' + Number(process.env.PR_NUMBER) + '`\n';
              }
              if (llmBridge) {
                body += '✅ **LLM Bridge**: `ghcr.io/kguardian-dev/kguardian/llm-bridge:pr-' + Number(process.env.PR_NUMBER) + '`\n';
              }
              if (evaluator) {
                body += '✅ **Evaluator**: `ghcr.io/kguardian-dev/kguardian/evaluator:pr-' + Number(process.env.PR_NUMBER) + '`\n';
              }
              if (supplychain) {
                body += '✅ **Supplychain**: `ghcr.io/kguardian-dev/kguardian/supplychain:pr-' + Number(process.env.PR_NUMBER) + '`\n';
              }
              if (supplychainMatcher) {
                body += '✅ **Supplychain matcher**: `ghcr.io/kguardian-dev/kguardian/supplychain-matcher:pr-' + Number(process.env.PR_NUMBER) + '`\n';
              }
              if (cataloger) {
                body += '✅ **Cataloger**: `ghcr.io/kguardian-dev/kguardian/cataloger:pr-' + Number(process.env.PR_NUMBER) + '`\n';
              }

              body += '\n### 🧪 Testing Instructions\n\n';

              if (helmBuilt) {
                body += '**Option 1: Use PR Helm Chart (Recommended)**\n';
                body += 'A complete Helm chart with all PR changes has been published:\n```bash\n';
                body += '# Find the exact version\n';
                body += 'helm search repo oci://ghcr.io/kguardian-dev/charts --versions | grep pr' + Number(process.env.PR_NUMBER) + '\n\n';
                body += '# Install with PR chart\n';
                body += 'helm install kguardian oci://ghcr.io/kguardian-dev/charts/kguardian \\\n';
                body += '  --version <VERSION-FROM-ABOVE> \\\n';
                body += '  --namespace kguardian \\\n';
                body += '  --create-namespace \\\n';
                body += '  --wait\n';
                body += '```\n\n';
              }

              body += '**Option 2: Use Released Chart with PR Images**\n';
              body += '```bash\n';
              body += 'helm upgrade --install kguardian oci://ghcr.io/kguardian-dev/charts/kguardian \\\n';
              body += '  --namespace kguardian \\\n';
              body += '  --create-namespace \\\n';

              if (controller) {
                body += '  --set controller.image.tag=pr-' + Number(process.env.PR_NUMBER) + ' \\\n';
              }
              if (broker) {
                body += '  --set broker.image.tag=pr-' + Number(process.env.PR_NUMBER) + ' \\\n';
              }
              if (frontend) {
                body += '  --set frontend.image.tag=pr-' + Number(process.env.PR_NUMBER) + ' \\\n';
              }
              if (llmBridge) {
                body += '  --set llmBridge.enabled=true \\\n';
                body += '  --set llmBridge.image.tag=pr-' + Number(process.env.PR_NUMBER) + ' \\\n';
              }
              if (supplychain) {
                body += '  --set supplychain.enabled=true \\\n';
                body += '  --set supplychain.image.tag=pr-' + Number(process.env.PR_NUMBER) + ' \\\n';
              }

              body += '  --wait\n';
              body += '```\n';
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
