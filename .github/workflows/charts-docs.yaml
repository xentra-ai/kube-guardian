---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Charts: Update README"

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/charts-readme-docs.yaml'
      - 'charts/**'

env:
  HELM_DOCS_VERSION: 1.11.2

jobs:
  chart-readme:
    name: Update README
    runs-on: ubuntu-latest
    # Same-repo PRs only: this job checks out the head branch by name
    # from THIS repo and commits the regenerated README back to it —
    # a fork's branch is unreachable that way and unwritable with the
    # read-only fork-PR token. Maintainers regenerate the README when
    # the change lands.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: install helm-docs
        run: |
          cd /tmp
          wget https://github.com/norwoodj/helm-docs/releases/download/v${{env.HELM_DOCS_VERSION}}/helm-docs_Linux_x86_64.tar.gz
          tar -xvf helm-docs_Linux_x86_64.tar.gz
          sudo mv helm-docs /usr/local/sbin

      - name: run helm-docs
        run: |
          helm-docs -t README.md.gotmpl -o README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        id: auto-commit
        with:
          branch: ${{ github.event.pull_request.head.ref }}
