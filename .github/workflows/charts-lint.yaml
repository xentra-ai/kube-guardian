---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint and Test Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/charts-lint.yaml'
      - 'charts/**'
      - 'test/helm-values-compat.sh'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'
          check-latest: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          changed=$(ct list-changed --target-branch "$DEFAULT_BRANCH")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --config .github/ct.yaml --target-branch "$DEFAULT_BRANCH"

      # G4 gate: render the chart with the value
      # sets real operators run — legacy per-component AI flags, the ai.enabled
      # umbrella, external DB, broker auth — and assert each still produces the
      # expected workloads. Guards upgrade-compatibility; fast, no cluster.
      # Not gated on list-changed: that only sees chart changes, and this
      # must also run when the script itself changes.
      - name: Values-compatibility check (G4)
        run: ./test/helm-values-compat.sh

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      # A chart bump PR typically references images whose release builds
      # are still running — release-please cuts the tag minutes before
      # the bump PR opens, and the multi-arch Rust builds take 50-80
      # minutes (arm64 runs under QEMU). Without
      # this, ct install fails on ErrImagePull through no fault of the
      # chart and every bump PR is born red (it has happened on three
      # consecutive bumps). Wait — bounded — for each kguardian image
      # the chart actually renders before installing.
      - name: Wait for referenced images
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          images=$(helm template charts/kguardian \
            | grep -oE 'image: *"?[^"]+"?' \
            | sed -E 's/image: *"?([^"]+)"?/\1/' \
            | grep '^ghcr.io/kguardian-dev/' | sort -u)
          echo "chart references:"; echo "$images"
          # 100 minutes: longer than the slowest broker release build seen.
          deadline=$(( $(date +%s) + 6000 ))
          for img in $images; do
            until docker manifest inspect "$img" >/dev/null 2>&1; do
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::$img still absent after 100 minutes — release build failed or tag never cut"
                exit 1
              fi
              echo "waiting for $img ..."
              sleep 30
            done
            echo "present: $img"
          done

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct install --config .github/ct.yaml --target-branch "$DEFAULT_BRANCH"
