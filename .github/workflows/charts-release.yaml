---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Charts: Release to GHCR OCI"

on:
  workflow_dispatch: {}
  push:
    tags:
      - "chart/v*"

env:
  CHARTS_SRC_DIR: "kguardian"
  TARGET_REGISTRY: ghcr.io

jobs:
  release-charts:
    name: Release Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the chart, its signature and provenance
      id-token: write # Sigstore keyless signing (cosign + actions/attest)
      attestations: write # store the provenance attestation in GitHub
      artifact-metadata: write # storage record for the attested chart
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.TARGET_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1 # keep in step with charts-lint.yaml

      # Never publish a chart that points at an image that is not in GHCR:
      # every install of it would sit in ImagePullBackOff. Renders with every
      # optional component on, so their images are checked too, and fails if
      # a kguardian repository in values.yaml did not render at all (a new
      # component this list does not switch on yet). charts-lint already
      # waited for the images on the release PR, so this only allows a short
      # grace period for registry propagation.
      - name: Check referenced images exist
        run: |
          set -euo pipefail
          chart="charts/${CHARTS_SRC_DIR}"
          images=$(helm template "$chart" \
              --set ai.enabled=true \
              --set evaluator.enabled=true \
              --set supplychain.enabled=true \
              --set supplychain.grype.enabled=true \
              --set broker.auth.enabled=true \
              --set broker.auth.existingSecret=release-check \
              --set nodeCatalog.enabled=true \
            | grep -oE 'image: *"?[^"]+"?' \
            | sed -E 's/image: *"?([^"]+)"?/\1/' \
            | grep '^ghcr.io/kguardian-dev/' | sort -u)
          echo "chart references:"; echo "$images"
          missing_repo=0
          while read -r repo; do
            if ! grep -qE "^${repo}[:@]" <<<"$images"; then
              echo "::error::${repo} is in values.yaml but did not render; switch its component on in this step"
              missing_repo=1
            fi
          done < <(grep -oE 'repository: *"?ghcr.io/kguardian-dev/[^" ]+' "$chart/values.yaml" \
            | sed -E 's/repository: *"?//' | sort -u)
          [ "$missing_repo" -eq 0 ] || exit 1
          deadline=$(( $(date +%s) + 600 ))
          for img in $images; do
            until docker manifest inspect "$img" >/dev/null 2>&1; do
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::$img is not in the registry; not publishing a chart that references it"
                exit 1
              fi
              echo "waiting for $img ..."
              sleep 30
            done
            echo "present: $img"
          done

      - name: Publish Helm Chart to GHCR
        id: push
        run: |
          set -euo pipefail
          helm package "charts/${CHARTS_SRC_DIR}"
          helm push kguardian-*.tgz "oci://${TARGET_REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts" 2>&1 | tee "${RUNNER_TEMP}/helm-push.log"
          # helm prints "Digest: sha256:..." for the pushed chart manifest.
          digest=$(sed -nE 's/^Digest: (sha256:[a-f0-9]{64})$/\1/p' "${RUNNER_TEMP}/helm-push.log" | tail -n1)
          if [ -z "$digest" ]; then
            echo "::error::could not read the pushed chart digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Sign and attest chart
        uses: ./.github/actions/sign-image
        with:
          image: ${{ env.TARGET_REGISTRY }}/${{ github.repository_owner }}/charts/${{ env.CHARTS_SRC_DIR }}
          digest: ${{ steps.push.outputs.digest }}
          recursive: "false"
          sbom: "false"
