---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Controller eBPF kernel matrix

# Loads every controller eBPF object on several real kernels, inside VMs,
# and fails if any of them does not load in its FULL configuration.
#
# Why: a CO-RE relocation that resolves on the kernels we build and test
# on can fail on another. kernfs_node.parent became __parent in 6.15, and
# the controller crashlooped on every cluster-00 node (6.18) with a
# BPF_PROG_LOAD -EINVAL that no unit test could see. Only the kernel's own
# loader and verifier answer "does this object load here", so this job
# asks them: 6.1 (below the supported floor), 6.6, 6.12 and 6.18 LTS.
#
# Kernel images are Cilium's little-vm-helper builds (BTF enabled), pinned
# by digest below; bump them by hand (quay.io/lvh-images/kernel-images,
# tags <ver>-main). Path-filtered to the eBPF sources and the loader so it
# only costs CI minutes when those change.
#
# Each VM also runs the syscall ownership gate end to end: loading is not
# enough, a 6.1 verifier loaded a gate that credited nothing.
#
# Each VM also runs the runtime inventory end-to-end test: a process in a
# kubepods-shaped cgroup execs from disk, from a memfd and (with the
# image's overlay.ko loaded) from an overlayfs lower and upper layer, and
# the probe must attribute and classify each one.
# Then many fresh cgroups of distinct pods are first touched at once from
# the preemptible library probe, and every cgroup must be credited to its
# own pod.
#
# Each VM also runs the node catalog's privileged tests (as root, with the
# image's overlay.ko loaded): the read-only open_tree clone of a root, and
# drift detection on a real overlay (whiteouts, opaque directories, the
# trusted.overlay.opaque=x mark), which need CAP_SYS_ADMIN to mount.
#
# Run the same check locally (no KVM needed, TCG works):
#   cargo test --all-features --lib --no-run
#   vmtest -k <vmlinuz> "<test binary> --ignored --exact \
#     bpf::tests::every_probe_object_loads_on_this_kernel --nocapture"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'controller/src/bpf/**'
      - 'controller/src/bpf.rs'
      - 'controller/src/catalog/**'
      - 'controller/build.rs'
      - 'controller/Cargo.lock'
      - '.github/workflows/controller-ebpf-kernels.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-ebpf-kernels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libelf-dev \
            libseccomp-dev \
            libbpf-dev \
            zlib1g-dev \
            pkg-config \
            protobuf-compiler

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            controller/target/
          key: ${{ runner.os }}-cargo-controller-test-${{ hashFiles('controller/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-controller-test-
            ${{ runner.os }}-cargo-controller-

      - name: Build the test binary
        working-directory: controller
        run: |
          bin=$(cargo test --all-features --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.kind == ["lib"]) | .executable' \
            | tail -1)
          test -x "$bin"
          cp "$bin" "$GITHUB_WORKSPACE/ebpf-load-test"

      # Real container runtimes for the capability probe's runtime-setup
      # test: static release binaries, pinned by version and sha256 (the
      # checksums published with each release), never installed.
      - name: Fetch container runtimes
        env:
          RUNC_VERSION: v1.5.2
          RUNC_SHA256: 599f6f94ff8c5057241eff0d54c3c74f95c34935b6457b33fe545defc61e9488
          CRUN_VERSION: 1.30.1
          CRUN_SHA256: e7b059390e27d0f283e1debbe89d9c5847870f3d8325f31ccd954533fdd6ea78
        run: |
          mkdir -p runtimes
          curl -fsSL -o runtimes/runc "https://github.com/opencontainers/runc/releases/download/${RUNC_VERSION}/runc.amd64"
          curl -fsSL -o runtimes/crun "https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64-disable-systemd"
          echo "${RUNC_SHA256}  runtimes/runc" | sha256sum -c -
          echo "${CRUN_SHA256}  runtimes/crun" | sha256sum -c -
          chmod +x runtimes/runc runtimes/crun

      - name: Fetch kernels
        env:
          K61: quay.io/lvh-images/kernel-images@sha256:8775ad49b3bc9e5f30b134f081ddf305bbd761084116768866918fe421e548e0 # 6.1-main
          K66: quay.io/lvh-images/kernel-images@sha256:b30a5bffdcdfd69e8cc1d147d13dc9d31ac993316e5e2f34db6c20e8b5a75db6 # 6.6-main
          K612: quay.io/lvh-images/kernel-images@sha256:0011d62b6675c5b1b36da3805f989c8443cd80259a9bdd814c34f25320fc67a0 # 6.12-main
          K618: quay.io/lvh-images/kernel-images@sha256:756c37658d791ed78ecc4ee8a327cf18291bfea14360ef11030082a34453afb7 # 6.18-main
        run: |
          mkdir -p kernels
          for pair in "6.1:$K61" "6.6:$K66" "6.12:$K612" "6.18:$K618"; do
            ver="${pair%%:*}"; image="${pair#*:}"
            id=$(docker create "$image" /nonexistent)
            docker cp "$id:/data/kernels/$ver/boot/." "kernels/$ver"
            # overlayfs is a module in these images; the runtime inventory
            # test insmods it to check image vs writable-layer detection
            # (it skips that part, and says so, without it).
            docker export "$id" | tar -x -C "kernels/$ver" --wildcards '*/fs/overlayfs/overlay.ko' || true
            find "kernels/$ver" -name overlay.ko -exec cp {} "kernels/overlay-$ver.ko" \; -quit
            docker rm "$id" >/dev/null
            cp kernels/$ver/vmlinuz-* "kernels/vmlinuz-$ver"
          done
          ls -la kernels

      # No shell variables ($x) in these commands: vmtest runs the command
      # through a shell of its own first, which expands them to "" before
      # the /bin/bash -c inside the VM sees them. A `for h in ...; do
      # HOOK=$h` loop here once pinned an empty hook and the capability
      # test skipped on every kernel.
      - name: Load on 6.1
        uses: danobi/vmtest-action@c0fe6f82e21db9b9a8105f2a385e8a6e3fff2d23 # v0.9
        with:
          name: linux-6.1
          kernel: kernels/vmlinuz-6.1
          command: /bin/bash -c "insmod ${{ github.workspace }}/kernels/overlay-6.1.ko || true; ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::every_probe_object_loads_on_this_kernel --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_ownership_gate_credits_a_pod_cgroup --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::runtime_inventory_reports_execs_and_libraries_per_container --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::owner_parse_is_right_for_every_cgroup_under_concurrency --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::a_lost_container_lookup_is_counted_and_the_file_reported_again --nocapture && RUNTIME_INVENTORY_CAP_HOOK=cap_capable ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_checks_are_counted_per_container_and_setup_is_not --nocapture && RUNTIME_INVENTORY_CAP_HOOK=security_capable ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_checks_are_counted_per_container_and_setup_is_not --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_setup_of_real_runtimes_is_not_counted --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_prefilter_skips_runtime_setup_by_provenance --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::readonly_clone_of_our_own_root_is_read_only_and_has_no_submounts --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::real_overlay_whiteouts_and_opaque_dirs_are_drift --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::a_trusted_opaque_x_parent_is_drift --nocapture"

      - name: Load on 6.6
        uses: danobi/vmtest-action@c0fe6f82e21db9b9a8105f2a385e8a6e3fff2d23 # v0.9
        with:
          name: linux-6.6
          kernel: kernels/vmlinuz-6.6
          command: /bin/bash -c "insmod ${{ github.workspace }}/kernels/overlay-6.6.ko || true; ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::every_probe_object_loads_on_this_kernel --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_ownership_gate_credits_a_pod_cgroup --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::runtime_inventory_reports_execs_and_libraries_per_container --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::owner_parse_is_right_for_every_cgroup_under_concurrency --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::a_lost_container_lookup_is_counted_and_the_file_reported_again --nocapture && RUNTIME_INVENTORY_CAP_HOOK=cap_capable ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_checks_are_counted_per_container_and_setup_is_not --nocapture && RUNTIME_INVENTORY_CAP_HOOK=security_capable ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_checks_are_counted_per_container_and_setup_is_not --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_setup_of_real_runtimes_is_not_counted --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_prefilter_skips_runtime_setup_by_provenance --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::readonly_clone_of_our_own_root_is_read_only_and_has_no_submounts --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::real_overlay_whiteouts_and_opaque_dirs_are_drift --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::a_trusted_opaque_x_parent_is_drift --nocapture"

      - name: Load on 6.12
        uses: danobi/vmtest-action@c0fe6f82e21db9b9a8105f2a385e8a6e3fff2d23 # v0.9
        with:
          name: linux-6.12
          kernel: kernels/vmlinuz-6.12
          command: /bin/bash -c "insmod ${{ github.workspace }}/kernels/overlay-6.12.ko || true; ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::every_probe_object_loads_on_this_kernel --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_ownership_gate_credits_a_pod_cgroup --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::runtime_inventory_reports_execs_and_libraries_per_container --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::owner_parse_is_right_for_every_cgroup_under_concurrency --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::a_lost_container_lookup_is_counted_and_the_file_reported_again --nocapture && RUNTIME_INVENTORY_CAP_HOOK=cap_capable ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_checks_are_counted_per_container_and_setup_is_not --nocapture && RUNTIME_INVENTORY_CAP_HOOK=security_capable ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_checks_are_counted_per_container_and_setup_is_not --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_setup_of_real_runtimes_is_not_counted --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_prefilter_skips_runtime_setup_by_provenance --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::readonly_clone_of_our_own_root_is_read_only_and_has_no_submounts --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::real_overlay_whiteouts_and_opaque_dirs_are_drift --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::a_trusted_opaque_x_parent_is_drift --nocapture"

      - name: Load on 6.18
        uses: danobi/vmtest-action@c0fe6f82e21db9b9a8105f2a385e8a6e3fff2d23 # v0.9
        with:
          name: linux-6.18
          kernel: kernels/vmlinuz-6.18
          command: /bin/bash -c "insmod ${{ github.workspace }}/kernels/overlay-6.18.ko || true; ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::every_probe_object_loads_on_this_kernel --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_ownership_gate_credits_a_pod_cgroup --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::runtime_inventory_reports_execs_and_libraries_per_container --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::owner_parse_is_right_for_every_cgroup_under_concurrency --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::a_lost_container_lookup_is_counted_and_the_file_reported_again --nocapture && RUNTIME_INVENTORY_CAP_HOOK=cap_capable ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_checks_are_counted_per_container_and_setup_is_not --nocapture && RUNTIME_INVENTORY_CAP_HOOK=security_capable ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_checks_are_counted_per_container_and_setup_is_not --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_setup_of_real_runtimes_is_not_counted --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_prefilter_skips_runtime_setup_by_provenance --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::readonly_clone_of_our_own_root_is_read_only_and_has_no_submounts --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::real_overlay_whiteouts_and_opaque_dirs_are_drift --nocapture && ${{ github.workspace }}/ebpf-load-test --ignored --exact catalog::root::tests::a_trusted_opaque_x_parent_is_drift --nocapture"

      # This step loads no overlay module, so runc seals runc init into a
      # memfd instead of an overlay file: the real-runtime test covers that
      # path here.
      # The steps above boot the images' default (voluntary) preemption,
      # where the library probe cannot be preempted mid-parse. One kernel
      # again with preempt=full, where it can, for the concurrency test.
      - name: Concurrency on 6.18 (preempt=full)
        uses: danobi/vmtest-action@c0fe6f82e21db9b9a8105f2a385e8a6e3fff2d23 # v0.9
        with:
          name: linux-6.18-preempt-full
          kernel: kernels/vmlinuz-6.18
          kernel_args: preempt=full
          command: /bin/bash -c "grep -q preempt=full /proc/cmdline && ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::owner_parse_is_right_for_every_cgroup_under_concurrency --nocapture && ! grep -qw overlay /proc/filesystems && KG_RUNC=${{ github.workspace }}/runtimes/runc ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::capability_setup_of_real_runtimes_is_not_counted --nocapture && KG_RUNC=${{ github.workspace }}/runtimes/runc KG_CRUN=${{ github.workspace }}/runtimes/crun ${{ github.workspace }}/ebpf-load-test --ignored --exact bpf::tests::syscall_prefilter_skips_runtime_setup_by_provenance --nocapture"
