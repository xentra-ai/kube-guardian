---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Push Evaluator Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - "evaluator/v*"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image, its signature and attestations
      id-token: write # Sigstore keyless signing (cosign + actions/attest)
      attestations: write # store provenance/SBOM attestations in GitHub
      artifact-metadata: write # storage record for the attested image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          install: true
          version: latest
          cache-binary: false # no shared runner cache in signed release builds

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: extract_tag
        env:
          GITHUB_REF_NAME_ENV: ${{ github.ref_name }}
        run: |
          # Tag format is "evaluator/vX.Y.Z" — strip the "evaluator/" prefix.
          # Validate the result so a malformed tag fails loudly instead of
          # being interpolated into the docker tag below.
          VERSION="${GITHUB_REF_NAME_ENV#evaluator/}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Refusing to build for malformed tag: $GITHUB_REF_NAME_ENV"
            exit 1
          fi
          echo "TAG_NAME=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: evaluator/
          file: evaluator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kguardian-dev/kguardian/evaluator:${{ steps.extract_tag.outputs.TAG_NAME }}
            ghcr.io/kguardian-dev/kguardian/evaluator:latest
          # Provenance comes from actions/attest in the sign step below (signed,
          # pushed as a referrer). Buildx's own attestation manifests are
          # unsigned and would add unknown/unknown entries to the index.
          provenance: false

      - name: Sign and attest image
        uses: ./.github/actions/sign-image
        with:
          image: ghcr.io/kguardian-dev/kguardian/evaluator
          digest: ${{ steps.build.outputs.digest }}
