apiVersion: v2
name: kguardian
description: Kubernetes network traffic & security monitoring using eBPF
home: https://github.com/kguardian-dev/kguardian

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.23.0

# appVersion is intentionally omitted: kguardian is multi-component and each
# service pins its own image tag in values.yaml, so no single application
# version exists. The chart `version` above is the only release identifier.
kubeVersion: ">= 1.18.0-0"

keywords:
  - BPF
  - eBPF
  - Kubernetes
  - Networking
  - Security
  - Observability
  - Troubleshooting

sources:
  - https://github.com/kguardian-dev/kguardian

maintainers:
  - name: maheshrayas
  - name: xunholy
