{{- if include "kguardian.llmBridgeEnabled" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.llmBridge.service.name }}
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
spec:
  {{- /* Not implemented — see the comment in broker/deployment.yaml. */ -}}
  {{- if .Values.llmBridge.autoscaling.enabled }}
  {{- fail "llmBridge.autoscaling.enabled=true is not supported: this chart ships no HorizontalPodAutoscaler, so enabling it removes spec.replicas and lets the replica count default to 1. Set llmBridge.autoscaling.enabled=false and use llmBridge.replicaCount." }}
  {{- end }}
  replicas: {{ .Values.llmBridge.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.llmBridge.service.name }}
  template:
    metadata:
      {{- with .Values.llmBridge.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kguardian.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ .Values.llmBridge.service.name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.llmBridge.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ default "llm-bridge" .Values.llmBridge.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.llmBridge.podSecurityContext | nindent 8 }}
      containers:
        - name: llm-bridge
          securityContext:
            {{- toYaml .Values.llmBridge.securityContext | nindent 12 }}
          {{- if .Values.llmBridge.image.sha }}
          image: "{{ .Values.llmBridge.image.repository }}@{{ .Values.llmBridge.image.sha }}"
          {{- else }}
          image: "{{ .Values.llmBridge.image.repository }}:{{ include "kguardian.imageTag" .Values.llmBridge.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.llmBridge.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.llmBridge.container.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.llmBridge.container.port }}"
            # the assistant runs all 12 tools in-process and reaches
            # the data plane directly — no mcp-server hop, and policy/seccomp
            # generation is in-process too, so it only needs the broker.
            - name: BROKER_URL
              value: "http://{{ .Values.broker.service.name }}.{{ include "kguardian.namespace" . }}.svc.cluster.local:{{ .Values.broker.service.port }}"
            {{- include "kguardian.brokerAuthEnv" . | nindent 12 }}
            - name: NODE_ENV
              value: "production"
            # One-line provider path (ai.provider + ai.secret). Additive — the
            # per-provider blocks below still work for multi-provider setups.
            {{- include "kguardian.aiProviderEnv" . | nindent 12 }}
            # Gateway support (ai.baseUrl + ai.model): point the provider named
            # by ai.provider at an OpenAI-compatible gateway instead of the
            # vendor API. Emits nothing when both are empty. Note the key is
            # still required — provider availability is gated on the API key
            # alone, so a gateway without ai.secret leaves the assistant dark.
            {{- include "kguardian.aiEndpointEnv" . | nindent 12 }}
            # External MCP endpoint (ai.mcp.*) at /mcp on this same port.
            # Emits nothing unless enabled, so the path 404s by default.
            {{- include "kguardian.mcpEnv" . | nindent 12 }}
            {{- if .Values.llmBridge.secrets.openai.enabled }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmBridge.secrets.openai.name }}
                  key: {{ .Values.llmBridge.secrets.keyName }}
                  optional: true
            {{- end }}
            {{- if .Values.llmBridge.secrets.anthropic.enabled }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmBridge.secrets.anthropic.name }}
                  key: {{ .Values.llmBridge.secrets.keyName }}
                  optional: true
            {{- end }}
            {{- if .Values.llmBridge.secrets.gemini.enabled }}
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmBridge.secrets.gemini.name }}
                  key: {{ .Values.llmBridge.secrets.keyName }}
                  optional: true
            {{- end }}
            {{- if .Values.llmBridge.secrets.copilot.enabled }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmBridge.secrets.copilot.name }}
                  key: {{ .Values.llmBridge.secrets.keyName }}
                  optional: true
            {{- end }}
            {{- with .Values.llmBridge.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.llmBridge.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.llmBridge.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.llmBridge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llmBridge.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llmBridge.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llmBridge.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "kguardian.priorityClassName" (dict "component" .Values.llmBridge "global" .Values.global) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
{{- end }}
