---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kguardian.name" . }}-broker
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
spec:
  {{- /*
    autoscaling.enabled is not implemented. The chart ships no HPA template
    for any component (no HorizontalPodAutoscaler anywhere under templates/),
    so setting it does not autoscale — it deletes `replicas` from this
    Deployment and nothing takes ownership of the field, which means the
    API server defaults it to 1 and a Helm upgrade of an existing release
    scales it DOWN to a single pod.

    It also silently disarms the singleton-PDB guardrail next door in
    pdb.yaml: that check reads `.Values.broker.replicaCount`, not the
    effective replica count, so with replicaCount=3 and autoscaling on it
    sees 3, renders `minAvailable: 1` against the one pod that actually
    exists, and every voluntary eviction is refused — the exact drain
    deadlock the guardrail was written to prevent.

    Failing loudly rather than honouring it, which is what the evaluator
    already does for its own reason. Implementing real HPAs is a feature,
    and not every component can take one (the controller is a DaemonSet).
  */ -}}
  {{- if .Values.broker.autoscaling.enabled }}
  {{- fail "broker.autoscaling.enabled=true is not supported: this chart ships no HorizontalPodAutoscaler, so enabling it removes spec.replicas, lets the replica count default to 1, and disarms the PDB singleton guard (causing kubectl drain to stall). Set broker.autoscaling.enabled=false and use broker.replicaCount." }}
  {{- end }}
  replicas: {{ .Values.broker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.broker.service.name }}
  template:
    metadata:
      {{- with .Values.broker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kguardian.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ .Values.broker.service.name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.broker.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ default "broker" .Values.broker.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.broker.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-db
          {{- if .Values.broker.initContainer.image.sha }}
          image: "{{ .Values.broker.initContainer.image.repository }}@{{ .Values.broker.initContainer.image.sha }}"
          {{- else }}
          image: "{{ .Values.broker.initContainer.image.repository }}:{{ .Values.broker.initContainer.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.broker.initContainer.image.pullPolicy }}
          command: ["sh", "-c", "until nc -z {{ include "kguardian.dbHost" . }} {{ include "kguardian.dbPort" . }}; do echo 'waiting for db'; sleep 2; done"]
          securityContext:
            {{- toYaml .Values.broker.initContainer.securityContext | nindent 12 }}
      containers:
        - name: broker
          securityContext:
            {{- toYaml .Values.broker.securityContext | nindent 12 }}
          {{- if .Values.broker.image.sha }}
          image: "{{ .Values.broker.image.repository }}@{{ .Values.broker.image.sha }}"
          {{- else }}
          image: "{{ .Values.broker.image.repository }}:{{ include "kguardian.imageTag" .Values.broker.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.broker.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.broker.container.port }}
              protocol: TCP
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kguardian.dbSecretName" . }}
                  key: {{ .Values.database.passwordSecretKey }}
            - name: DATABASE_URL
              value: {{ include "kguardian.dbUrl" . | quote }}
            {{- if ne (int .Values.broker.container.port) 9090 }}
            # Non-default port: wire it through via LISTEN_ADDR. An
            # explicit LISTEN_ADDR binds verbatim, so this pins an
            # IPv4-only socket — on an IPv6-only cluster with a custom
            # port, override to "[::]:<port>" instead. With the default
            # port this env is intentionally OMITTED so the broker's
            # dual-stack default bind ([::] with an IPv4 fallback)
            # stays in effect.
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.broker.container.port }}"
            {{- end }}
            {{- include "kguardian.brokerAuthEnv" . | nindent 12 }}
            {{- if .Values.evaluator.enabled }}
            - name: EVALUATOR_URL
              value: "http://{{ .Values.evaluator.service.name }}.{{ include "kguardian.namespace" . | trim }}.svc.cluster.local:{{ .Values.evaluator.service.port }}"
            {{- end }}
            {{/*
              `with` treats 0 as falsy and skips the block — so
              setting broker.audit.retention.days: 0 (the documented
              "disable retention" value) would silently NOT propagate
              the env var, and the broker would fall back to its
              30-day default. Operators expecting to disable retention
              would keep accumulating audit_verdicts forever and not
              notice until the table grew huge. Use an explicit
              hasKey check instead so 0 propagates correctly.
            */}}
            {{- if hasKey .Values.broker.audit.retention "days" }}
            - name: AUDIT_VERDICTS_RETENTION_DAYS
              value: {{ .Values.broker.audit.retention.days | quote }}
            {{- end }}
            {{- if hasKey .Values.broker.audit.retention "intervalSeconds" }}
            - name: AUDIT_VERDICTS_RETENTION_INTERVAL_SECS
              value: {{ .Values.broker.audit.retention.intervalSeconds | quote }}
            {{- end }}
            {{- if hasKey .Values.broker.audit.retention "batchSize" }}
            - name: AUDIT_VERDICTS_RETENTION_BATCH_SIZE
              value: {{ .Values.broker.audit.retention.batchSize | quote }}
            {{- end }}
            {{- if hasKey .Values.broker.audit "inflightPermits" }}
            - name: AUDIT_INFLIGHT_PERMITS
              value: {{ .Values.broker.audit.inflightPermits | quote }}
            {{- end }}
            {{- if hasKey (.Values.broker.peerResolution | default dict) "lateResolveWindowSeconds" }}
            - name: PEER_LATE_RESOLVE_WINDOW_SECS
              value: {{ .Values.broker.peerResolution.lateResolveWindowSeconds | quote }}
            {{- end }}
            {{- if hasKey (.Values.broker.peerResolution | default dict) "staleAliveSeconds" }}
            - name: PEER_STALE_ALIVE_SECS
              value: {{ .Values.broker.peerResolution.staleAliveSeconds | quote }}
            {{- end }}
            {{- if hasKey .Values.broker.audit "evalTimeoutMs" }}
            - name: AUDIT_EVAL_TIMEOUT_MS
              value: {{ .Values.broker.audit.evalTimeoutMs | quote }}
            {{- end }}
            {{- if hasKey .Values.broker "dbPoolMaxSize" }}
            - name: DB_POOL_MAX_SIZE
              value: {{ .Values.broker.dbPoolMaxSize | quote }}
            {{- end }}
            {{- if hasKey .Values.broker "statementTimeoutMs" }}
            - name: DB_STATEMENT_TIMEOUT_MS
              value: {{ .Values.broker.statementTimeoutMs | quote }}
            {{- end }}
            {{- if hasKey .Values.broker "readMemoryBudgetMb" }}
            - name: BROKER_READ_MEMORY_BUDGET_MB
              value: {{ .Values.broker.readMemoryBudgetMb | quote }}
            {{- end }}
            {{- if hasKey .Values.broker "readAcquireWaitMs" }}
            - name: BROKER_READ_ACQUIRE_WAIT_MS
              value: {{ .Values.broker.readAcquireWaitMs | quote }}
            {{- end }}
            {{- if .Values.broker.resources.limits.memory }}
            # Downward API, not a templated value: reports the container's
            # real memory limit in MiB whatever unit values.yaml spells it
            # in. The broker clamps its read budget to 30% of this and warns
            # if an operator raised the budget without raising the limit —
            # the misconfiguration that OOMKilled it.
            - name: BROKER_MEMORY_LIMIT_MB
              valueFrom:
                resourceFieldRef:
                  containerName: broker
                  resource: limits.memory
                  divisor: 1Mi
            {{- end }}
            {{- if hasKey .Values.broker "dbMigrationMaxRetries" }}
            - name: DB_MIGRATION_MAX_RETRIES
              value: {{ .Values.broker.dbMigrationMaxRetries | quote }}
            {{- end }}
            {{/*
              Compute history retention + finding thresholds (values.yaml
              `compute`). Rendered whether or not compute.enabled: the
              broker serves whatever the controllers send, and an operator
              who turns the feature off on the controllers still wants the
              retention pass to prune what was collected. Explicit
              `hasKey` so retentionDays: 0 (disable history) propagates.
            */}}
            {{- $compute := .Values.compute | default dict }}
            {{- $history := $compute.history | default dict }}
            {{- $thresholds := $compute.thresholds | default dict }}
            {{- if hasKey $history "retentionDays" }}
            - name: COMPUTE_HISTORY_RETENTION_DAYS
              value: {{ $history.retentionDays | quote }}
            {{- end }}
            {{- if hasKey $history "minuteResolutionHours" }}
            - name: COMPUTE_HISTORY_MINUTE_HOURS
              value: {{ $history.minuteResolutionHours | quote }}
            {{- end }}
            {{- if hasKey $thresholds "stallSome" }}
            - name: COMPUTE_THRESHOLD_STALL_SOME
              value: {{ $thresholds.stallSome | quote }}
            {{- end }}
            {{- if hasKey $thresholds "runqP99Ms" }}
            - name: COMPUTE_THRESHOLD_RUNQ_P99_MS
              value: {{ $thresholds.runqP99Ms | quote }}
            {{- end }}
            {{- if hasKey $thresholds "throttledRatio" }}
            - name: COMPUTE_THRESHOLD_THROTTLED_RATIO
              value: {{ $thresholds.throttledRatio | quote }}
            {{- end }}
            {{- if hasKey $thresholds "throttledRatioMax" }}
            - name: COMPUTE_THRESHOLD_THROTTLED_RATIO_MAX
              value: {{ $thresholds.throttledRatioMax | quote }}
            {{- end }}
            {{- if hasKey $thresholds "blameShare" }}
            - name: COMPUTE_THRESHOLD_BLAME_SHARE
              value: {{ $thresholds.blameShare | quote }}
            {{- end }}
            {{- if hasKey $thresholds "memStallSome" }}
            - name: COMPUTE_THRESHOLD_MEM_STALL_SOME
              value: {{ $thresholds.memStallSome | quote }}
            {{- end }}
            # Anonymous version check-in (see docs/telemetry). CHART_VERSION
            # and KUBE_VERSION are captured at install/upgrade time and ride
            # the daily check-in; disable with telemetry.enabled=false.
            - name: TELEMETRY_ENABLED
              value: {{ .Values.telemetry.enabled | quote }}
            - name: TELEMETRY_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: KUBE_VERSION
              value: {{ .Capabilities.KubeVersion.Version | quote }}
            # Which optional features are on, as fixed slugs — part of
            # the telemetry check-in (contract v2, docs/telemetry.mdx).
            # Flag names only, never configuration values.
            - name: FEATURES
              {{- $features := list }}
              {{- if or .Values.ai.enabled .Values.llmBridge.enabled }}{{- $features = append $features "ai" }}{{- end }}
              {{- if .Values.evaluator.enabled }}{{- $features = append $features "audit" }}{{- end }}
              {{- if .Values.broker.networkPolicy.enabled }}{{- $features = append $features "netpol" }}{{- end }}
              {{- if .Values.frontend.sso.enabled }}{{- $features = append $features "sso" }}{{- end }}
              value: {{ join "," $features | quote }}
          {{- with .Values.broker.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /health does a DB schema+reachability check, so it can blip
          # 503 under heavy read load (e.g. a large /pod/info serialize).
          # Liveness is deliberately tolerant — it should only restart the
          # broker on SUSTAINED failure (a real DB loss, the #876 self-heal
          # case: ~10 x 20s = 200s), never on a transient load spike, or it
          # death-spirals (kill -> restart -> clients ECONNREFUSED -> retry
          # storm). Readiness is more responsive so a struggling broker is
          # pulled from the Service without being killed.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
         {{- with .Values.broker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.broker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.broker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.broker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.broker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "kguardian.priorityClassName" (dict "component" .Values.broker "global" .Values.global) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
