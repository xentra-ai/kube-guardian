{{- if .Values.evaluator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kguardian.name" . }}-evaluator
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
rules:
  # Read pod + namespace state for selector evaluation.
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
  # Read the NetworkPolicies actually installed in the cluster, to
  # classify a reported drop by whether one could have caused it. The
  # drop probe observes a TCP handshake that never completed and cannot
  # see why; without this the evaluator reports every drop cause as
  # "unknown", which is honest but unhelpful. Read-only, and its own
  # informer is deliberately excluded from the startup sync gate so an
  # evaluator that rolls out ahead of this rule still starts.
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [list, watch]
  # Watch the AuditNetworkPolicy CRDs via the dynamic client.
  - apiGroups: [kguardian.dev]
    resources: [auditnetworkpolicies, auditclusternetworkpolicies]
    verbs: [get, list, watch]
  # Allow the evaluator to write back rolling-window evaluation summary
  # via the status subresource. Spec edits are not granted.
  - apiGroups: [kguardian.dev]
    resources: [auditnetworkpolicies/status, auditclusternetworkpolicies/status]
    verbs: [get, update, patch]
  # Emit Kubernetes Events on the AuditNetworkPolicy when a flow would
  # be denied (post-MVP — RBAC pre-granted so it's ready when the
  # event-emission code lands).
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
{{- end }}
