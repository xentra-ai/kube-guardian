---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kguardian.name" . }}-frontend
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
spec:
  {{- /* Not implemented — see the comment in broker/deployment.yaml. */ -}}
  {{- if .Values.frontend.autoscaling.enabled }}
  {{- fail "frontend.autoscaling.enabled=true is not supported: this chart ships no HorizontalPodAutoscaler, so enabling it removes spec.replicas and lets the replica count default to 1. Set frontend.autoscaling.enabled=false and use frontend.replicaCount." }}
  {{- end }}
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.frontend.service.name }}
  template:
    metadata:
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kguardian.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ .Values.frontend.service.name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.frontend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ default "frontend" .Values.frontend.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          {{- if .Values.frontend.image.sha }}
          image: "{{ .Values.frontend.image.repository }}@{{ .Values.frontend.image.sha }}"
          {{- else }}
          image: "{{ .Values.frontend.image.repository }}:{{ include "kguardian.imageTag" .Values.frontend.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.container.port }}
              protocol: TCP
          env:
            - name: VITE_API_URL
              value: "http://{{ .Values.broker.service.name }}.{{ include "kguardian.namespace" . }}.svc.cluster.local:{{ .Values.broker.container.port }}"
            {{- if include "kguardian.llmBridgeEnabled" . }}
            - name: VITE_LLM_BRIDGE_URL
              value: "http://{{ .Values.llmBridge.service.name }}.{{ include "kguardian.namespace" . }}.svc.cluster.local:{{ .Values.llmBridge.service.port }}"
            {{- end }}
          {{- with .Values.frontend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
         {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "kguardian.priorityClassName" (dict "component" .Values.frontend "global" .Values.global) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
