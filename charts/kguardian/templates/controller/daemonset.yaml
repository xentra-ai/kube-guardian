---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kguardian.name" . }}-controller
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
spec:
  {{- with .Values.controller.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kguardian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kguardian
        {{- include "kguardian.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.controller.serviceAccount.automountServiceAccountToken }}
      hostNetwork: true
      {{- if .Values.controller.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml .Values.controller.imagePullSecrets | indent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-api
          {{- if .Values.controller.initContainer.image.sha }}
          image: "{{ .Values.controller.initContainer.image.repository }}@{{ .Values.controller.initContainer.image.sha }}"
          {{- else }}
          image: "{{ .Values.controller.initContainer.image.repository }}:{{ .Values.controller.initContainer.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.controller.initContainer.image.pullPolicy }}
          command: ["sh", "-c", "until wget -qO- http://{{ .Values.broker.service.name }}.{{ include "kguardian.namespace" . }}.svc.cluster.local:{{ .Values.broker.container.port }}/health; do sleep 5; done"]
          securityContext:
            {{- toYaml .Values.controller.initContainer.securityContext | nindent 12 }}
      containers:
        - name: controller
          {{- if .Values.controller.image.sha }}
          image: "{{ .Values.controller.image.repository }}@{{ .Values.controller.image.sha }}"
          {{- else }}
          image: "{{ .Values.controller.image.repository }}:{{ include "kguardian.imageTag" .Values.controller.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
          env:
          - name: RUST_LOG
            value: INFO
          - name: CURRENT_NODE
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: API_ENDPOINT
            value: "http://{{ .Values.broker.service.name }}.{{ include "kguardian.namespace" . }}.svc.cluster.local:{{ .Values.broker.container.port }}"
          {{- include "kguardian.brokerAuthEnv" . | nindent 10 }}
          - name: EXCLUDED_NAMESPACES
            value: "{{ .Values.controller.excludedNamespaces | join "," }}"
          - name: IGNORE_DAEMONSET_TRAFFIC
            value: "{{ .Values.controller.ignoreDaemonSet }}"
          - name: CONTAINERD_SOCK
            value: "{{ .Values.controller.containerdSockPath }}"
          {{- $level := .Values.syscalls.captureLevel | default "full" | toString | lower }}
          {{- if not (has $level (list "full" "high" "medium" "low" "custom")) }}
          {{- fail (printf "syscalls.captureLevel must be one of full, high, medium, low, custom (got %q)" $level) }}
          {{- end }}
          {{- if and (eq $level "custom") (not .Values.syscalls.customList) }}
          {{- fail "syscalls.captureLevel is custom but syscalls.customList is empty" }}
          {{- end }}
          # Syscall capture tier. Only `full` yields a complete seccomp
          # profile; see values.yaml `syscalls`.
          - name: SYSCALL_CAPTURE_LEVEL
            value: {{ $level | quote }}
          {{- if eq $level "custom" }}
          - name: SYSCALL_CUSTOM_LIST
            value: {{ .Values.syscalls.customList | join "," | quote }}
          {{- end }}
          {{- if .Values.seccomp.distribute }}
          - name: SECCOMP_DISTRIBUTE
            value: "true"
          - name: SECCOMP_ROOT
            value: "{{ .Values.seccomp.kubeletRoot }}/seccomp"
          {{- with .Values.seccomp.distributeIntervalSeconds }}
          - name: SECCOMP_DISTRIBUTE_INTERVAL_SECS
            value: "{{ . }}"
          {{- end }}
          {{- end }}
          {{- $compute := .Values.compute | default dict }}
          {{- if $compute.enabled }}
          # Compute gauges + noisy-neighbour detection (values.yaml `compute`).
          # The cgroup sampler is the master switch; the scheduler probe is a
          # second switch beneath it and is off by default until measured.
          - name: COMPUTE_ENABLED
            value: "true"
          - name: COMPUTE_SAMPLE_INTERVAL_SECS
            value: {{ $compute.sampleInterval | default 5 | quote }}
          - name: COMPUTE_CONTENTION_ENABLED
            value: {{ (($compute.contention | default dict).enabled | default false) | quote }}
          - name: COMPUTE_MIN_RUNQ_LATENCY_US
            value: {{ (($compute.contention | default dict).minRunqLatencyUs | default 100) | quote }}
          {{- else }}
          - name: COMPUTE_ENABLED
            value: "false"
          {{- end }}
          volumeMounts:
          {{- if .Values.seccomp.distribute }}
          - name: seccomp-profiles
            mountPath: {{ .Values.seccomp.kubeletRoot }}/seccomp
          {{- end }}
          {{- if $compute.enabled }}
          - name: cgroupfs
            mountPath: /sys/fs/cgroup
            readOnly: true
          {{- end }}
          - mountPath: /sys/kernel/debug
            name: debugfs
            readOnly: true
          - name: bpffs
            mountPath: /sys/fs/bpf
            readOnly: true
          - name: run-containerd-bundle
            mountPath: /run/containerd/io.containerd.runtime.v2.task
            readOnly: true
          - name: containerd-sock
            mountPath: {{ .Values.controller.containerdSockPath }}
            readOnly: true
          - mountPath: /sys/kernel/tracing
            name: tracefs
            readOnly: true
          - mountPath: /proc
            name: hostproc
            readOnly: true
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      serviceAccountName: {{ default "controller" .Values.controller.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "kguardian.priorityClassName" (dict "component" .Values.controller "global" .Values.global) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      volumes:
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
          type: Directory
      - name: run-containerd-bundle
        hostPath:
          path: {{ .Values.controller.containerdBundlePath }}
      - name: containerd-sock
        hostPath:
          path: {{ .Values.controller.containerdSockPath }}
      - hostPath:
          path: /proc
          type: Directory
        name: hostproc
      - hostPath:
          path: /sys/kernel/debug
        name: debugfs
      - hostPath:
          path: /sys/kernel/tracing
          type: Directory
        name: tracefs
      {{- if .Values.seccomp.distribute }}
      # Kubelet seccomp root. DirectoryOrCreate so the first node to
      # need it provisions the tree; the distributor only ever adds
      # files under kguardian/.
      - name: seccomp-profiles
        hostPath:
          path: {{ .Values.seccomp.kubeletRoot }}/seccomp
          type: DirectoryOrCreate
      {{- end }}
      {{- if (.Values.compute | default dict).enabled }}
      # cgroup v2 root, read-only: the compute sampler reads cpu.stat,
      # cpu.pressure, memory.* per container and /sys/fs/cgroup/cgroup.controllers
      # for the node facts. Nothing is ever written here.
      - name: cgroupfs
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      {{- end }}
      nodeSelector:
        {{- if .Values.controller.nodeSelector }}
          {{- toYaml .Values.controller.nodeSelector | nindent 8 }}
        {{- end }}
