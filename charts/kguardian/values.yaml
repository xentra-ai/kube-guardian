# Default values for kguardian.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  # -- Labels to apply to all resources
  labels: {}
  # -- Annotations to apply to all resources
  annotations: {}

  # -- Priority class to be used for the kguardian pods
  priorityClassName: ""

telemetry:
  # -- Enable the daily anonymous version check-in. The broker asks the
  # kguardian version service for the latest released versions (surfacing an
  # update notice in the UI and at GET /version); the request doubles as the
  # project's only usage signal. Exactly six fields are sent — a random
  # install UUID, broker version, chart version, Kubernetes version, live
  # node count, and CPU architecture. No cluster names, no IPs stored, no
  # user data. Documented verbatim at https://docs.kguardian.dev/telemetry.
  # Set to false to disable entirely: no task is spawned and no request is
  # ever made. Air-gapped/egress-restricted clusters can also just leave it
  # on — failures are silent and harmless.
  enabled: true
  # -- Version service the broker calls once a day. Override to self-host
  # or point at a mock; unreachable endpoints are ignored silently.
  endpoint: https://version.kguardian.dev/v1/check

namespace:
  # -- Namespace name. If empty, uses the release namespace
  name: ""
  # -- Labels to add to the namespace
  labels: {}
  # -- Annotations to add to the namespace
  annotations: {}

controller:
  image:
    # -- Controller container image repository
    repository: ghcr.io/kguardian-dev/kguardian/controller
    # -- Controller image pull policy
    pullPolicy: IfNotPresent
    # -- Controller version tag (auto-updated by release-please)
    tag: "1.12.1"
    # -- Overrides the image tag using SHA digest
    sha: ""
  initContainer:
    image:
      # -- Init container image repository
      repository: busybox
      # -- Init container image pull policy
      pullPolicy: Always
      # -- Init container image tag
      tag: latest
    # -- Init container security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  # -- List of image pull secrets for private registries
  imagePullSecrets: []
  # -- Override the name of the controller resources
  nameOverride: ""
  # -- Override the full name of the controller resources
  fullnameOverride: ""

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- Automount API credentials for a service account (controller needs K8s API access)
    automountServiceAccountToken: true

  # -- Annotations to add to controller pods
  podAnnotations: {}

  # -- Controller pod security context. Runs with seccomp RuntimeDefault profile
  podSecurityContext:
    # runAsUser: 1000
    # runAsGroup: 1000
    # fsGroup: 1000
    # fsGroupChangePolicy: OnRootMismatch
    # supplementalGroups: [1000]
    seccompProfile:
      type: RuntimeDefault

  # -- Controller container security context. Requires privileged mode for eBPF
  securityContext:
    privileged: true
    readOnlyRootFilesystem: true
    capabilities:
      add:
      - CAP_BPF
    allowPrivilegeEscalation: true

  service:
    # -- Controller service type
    type: ClusterIP
    # -- Controller service port
    port: 80

  # -- Controller pod resource requests and limits. eBPF requires more memory.
  resources:
    limits:
      # cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    # -- Enable horizontal pod autoscaling for controller
    enabled: false
    # -- Minimum number of controller replicas
    minReplicas: 1
    # -- Maximum number of controller replicas
    maxReplicas: 100
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Node labels for the kguardian controller pod assignment
  nodeSelector:
    kubernetes.io/os: linux

  # -- Tolerations for the kguardian controller pod assignment
  tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

  # -- Affinity rules for controller pod assignment
  affinity: {}

  # -- Priority class to be used for the kguardian controller pods
  priorityClassName: ""

  # -- Path to the containerd socket on the host node.
  # For k3s clusters, set to: /run/k3s/containerd/containerd.sock
  containerdSockPath: /run/containerd/containerd.sock

  # -- Path to the containerd runtime bundle directory on the host node.
  # For k3s clusters, set to: /run/k3s/containerd/io.containerd.runtime.v2.task
  containerdBundlePath: /run/containerd/io.containerd.runtime.v2.task

  # -- Rolling update strategy for the Controller DaemonSet. Kubernetes
  # defaults to maxUnavailable 1 with maxSurge 0, which updates one node at a
  # time. A node the kubelet refuses the pod on (DiskPressure, for example)
  # never becomes Ready, so it holds that single slot indefinitely and no
  # further node is updated. On a large cluster one unhealthy node can stall
  # the rollout completely. A percentage lets the rest proceed:
  #   updateStrategy:
  #     rollingUpdate:
  #       maxUnavailable: 20%
  updateStrategy: {}

  # -- Namespaces to be excluded from monitoring (comma-separated list)
  excludedNamespaces:
    - kguardian
    - kube-system

  # -- Skip DaemonSet pods: their network namespaces are not registered with
  # the eBPF probe, so their own flows are never recorded (log shippers,
  # CNI agents, node-exporter are noise for policy generation). Host-network
  # DaemonSet pods share the node's IP; those pods are still skipped, but
  # their IP is never added to the probe's ignore list, so traffic from any
  # pod TO a node IP (kubelet :10250, node-exporter :9100, etcd :2381,
  # apiserver :6443) is recorded and shows up in generated policies.
  # Controllers up to 1.11.0 ignored the node IP as well, which silently
  # dropped every pod-to-node flow.
  ignoreDaemonSet: true

# -- Syscall capture tier for the controller's eBPF probe. Sets
# `SYSCALL_CAPTURE_LEVEL` / `SYSCALL_CUSTOM_LIST` on the controller DaemonSet.
syscalls:
  # Tiers, most to least complete:
  #   full    — every syscall. The only tier that can export an enforcing
  #             seccomp profile; anything less is a partial set and a
  #             deny-by-default profile built from it will break the
  #             workload, so the broker refuses that combination unless the
  #             request passes `acknowledgePartial=true`. Audit-only
  #             (`SCMP_ACT_LOG`) exports are allowed from any tier.
  #   high    — everything except hot-path noise (read/write/futex/epoll/
  #             mmap/clock_gettime and similar).
  #   medium  — `low` plus the network, file-permission/link and process-
  #             lifecycle families.
  #   low     — the 57 security-relevant syscalls kguardian traced before
  #             this setting existed (exec, socket, mount, ptrace, bpf, ...).
  #   custom  — exactly the names in `syscalls.customList`.
  #
  # `full` is the default because the probe de-duplicates per pod network
  # namespace inside BPF: each syscall crosses into userspace once per pod,
  # so the CPU cost of full capture is close to that of `low`. Lower tiers
  # only reduce what reaches userspace on that first sighting. Names are
  # resolved per architecture at controller startup, so a tier selects the
  # same syscalls on amd64 and arm64. A workload can raise (never lower) its
  # own tier with the pod-template annotation
  # `kguardian.dev/syscall-capture: full`.
  #
  # -- Cluster-wide capture level: `full` (default, every syscall — the only
  # tier an enforcing seccomp profile can be exported from), `high`,
  # `medium`, `low` or `custom`. Full capture is de-duplicated in BPF so it
  # costs about the same CPU as `low`; pick a lower tier only if you never
  # intend to enforce seccomp profiles and want a smaller syscall table in
  # the broker. Below `full`, the broker still exports audit-only
  # (`SCMP_ACT_LOG`) profiles and stamps every manifest with
  # `kguardian.dev/capture-level` and `kguardian.dev/capture-complete`, but
  # refuses to render a denying `defaultAction` unless the request passes
  # `acknowledgePartial=true`. The block above lists what each tier traces.
  captureLevel: full
  # -- Syscall names for `captureLevel: custom` (ignored on any other level),
  # rendered comma-joined into `SYSCALL_CUSTOM_LIST`, e.g.
  # `[execve, openat, connect]`. A name unknown on the node's architecture is
  # logged and skipped, never fatal.
  customList: []

# -- Seccomp profile distribution, driven by the user-owned `SeccompProfile`
# CRD (`kguardian.dev/v1alpha1`). kguardian observes syscalls and renders a
# CR manifest you can commit; nothing reaches a node until you apply that CR.
# When `distribute` is on, the controller on every node watches
# `SeccompProfile` objects cluster-wide and writes each one to
# `<kubeletRoot>/seccomp/kguardian/<namespace>/<name>.json`, so a workload
# references it with `securityContext.seccompProfile.type: Localhost` +
# `localhostProfile: kguardian/<namespace>/<name>.json`. Deleting the CR
# deletes the file. kguardian never edits workloads and never writes a
# profile that is not backed by a CR. See docs/guides/distributing-seccomp-profiles.
seccomp:
  # -- Reconcile `SeccompProfile` CRs onto nodes. Adds a hostPath mount of the
  # kubelet seccomp directory to the controller pod and grants the controller
  # get/list/watch on `seccompprofiles`, patch on `seccompprofiles/status`, and
  # list on `nodes`. Off by default — referencing a profile is a
  # workload-availability decision for the app team. Without it the CRD still
  # installs and the UI still exports manifests; they just never land on a node.
  distribute: false
  # -- Install the `SeccompProfile` CRD as a chart template (with
  # `helm.sh/resource-policy: keep`) rather than from `crds/`. Helm applies
  # `crds/` on install only and never upgrades them; a templated CRD is
  # upgraded with the release, so schema changes ship with the chart. The
  # trade-off: the CRD is part of the release, so a `helm uninstall` leaves it
  # behind on purpose (the `keep` policy) — delete it by hand if you also want
  # every `SeccompProfile` object gone. Set to `false` if you manage CRDs
  # separately; then apply `charts/kguardian/files/kguardian.dev_seccompprofiles.yaml`
  # yourself before enabling `distribute`.
  installCRDs: true
  # -- Kubelet root directory on the host. Profiles are written under
  # `<kubeletRoot>/seccomp/kguardian/`. Not `/var/lib/kubelet` everywhere:
  # k3s uses `/var/lib/rancher/k3s/agent/kubelet`, some kubeadm installs and
  # OpenShift differ.
  kubeletRoot: /var/lib/kubelet
  # -- Seconds between full resyncs of the `SeccompProfile` watch (the watch
  # itself reacts to changes immediately). Empty uses the controller default (30).
  distributeIntervalSeconds: ""

broker:
  # -- Number of broker replicas to deploy
  replicaCount: 1
  image:
    # -- Broker container image repository
    repository: ghcr.io/kguardian-dev/kguardian/broker
    # -- Broker image pull policy
    pullPolicy: IfNotPresent
    # -- Broker version tag (auto-updated by release-please)
    tag: "1.15.1"
    # -- Overrides the image tag using SHA digest
    sha: ""
  initContainer:
    image:
      # -- Broker init container image repository
      repository: busybox
      # -- Broker init container image pull policy
      pullPolicy: Always
      # -- Broker init container image tag
      tag: latest
      # -- Overrides the init container image tag using SHA digest
      sha: ""
    # -- Broker init container security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  container:
    # -- Broker container port
    port: 9090

  # -- List of image pull secrets for private registries
  imagePullSecrets: []
  # -- Override the name of the broker resources
  nameOverride: ""
  # -- Override the full name of the broker resources
  fullnameOverride: ""

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- Automount API credentials for a service account
    automountServiceAccountToken: false

  # -- Annotations to add to broker pods
  podAnnotations: {}

  # -- Broker pod security context. Runs as non-root user 1000
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [1000]
    seccompProfile:
      type: RuntimeDefault

  # -- Broker container security context. Hardened with read-only root filesystem
  securityContext:
    privileged: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

  service:
    # -- Broker service name
    name: "kguardian-broker"
    # -- Broker service type
    type: ClusterIP
    # -- Broker service port
    port: 9090

  # -- Broker pod resource requests and limits
  resources:
    limits:
      # cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    # -- Enable horizontal pod autoscaling for broker
    enabled: false
    # -- Minimum number of broker replicas
    minReplicas: 1
    # -- Maximum number of broker replicas
    maxReplicas: 100
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Node labels for the kguardian broker pod assignment
  nodeSelector:
    kubernetes.io/os: linux

  # -- Tolerations for the kguardian broker pod assignment
  tolerations: []

  # -- Affinity rules for broker pod assignment
  affinity: {}

  # -- Priority class to be used for the kguardian broker pods
  priorityClassName: ""

  peerResolution:
    # -- Late-resolve window, in seconds. The broker stamps each
    # traffic row's peer identity (pod / host-network pod / Service)
    # when the row is ingested. A flow can arrive before the peer
    # pod's spec does, in which case the row is stored with a NULL
    # peer; a broker task wakes every 60 s (PEER_LATE_RESOLVE_INTERVAL_SECS,
    # not exposed here) and re-resolves NULL rows whose time_stamp is
    # younger than this window, at most 5000 per pass. Rows older
    # than the window stay NULL for good (pre-upgrade history, an
    # external IP, or a peer the cluster never learned about) and
    # consumers fall back to a start-time-guarded by-IP lookup for
    # them. Raise it on clusters where the controller lags pod
    # creation by more than ten minutes. 0 disables the task; new
    # rows then keep whatever resolved at ingest. Rendered as
    # PEER_LATE_RESOLVE_WINDOW_SECS.
    lateResolveWindowSeconds: 600
    # -- Stale-alive sweep, in seconds. The controller re-posts every
    # live pod every 60 s, so a pod_details row still marked alive
    # that has not been re-posted for this long is a ghost (its node's
    # controller lost it, or the row predates the upgrade). The broker
    # marks such rows dead so they cannot win the alive-first ordering
    # for an IP they no longer hold. 0 disables the sweep. Rendered as
    # PEER_STALE_ALIVE_SECS.
    staleAliveSeconds: 900

  audit:
    retention:
      # -- Retain audit_verdicts rows for this many days. Older rows are
      # pruned by a tokio task in the broker that wakes every
      # `intervalSeconds`. Set to 0 to disable retention entirely
      # (table grows unbounded).
      days: 30
      # -- How often the cleanup pass runs, in seconds. Minimum 60.
      intervalSeconds: 3600
      # -- Rows deleted per batched DELETE. The retention loop issues
      # one DELETE per batch — bounded lock hold and bounded WAL chunk
      # — and loops until the window is empty or a per-pass cap is
      # hit. Clamped in the broker to [100, 100000]; values outside
      # that range either round-trip the DB for trivial work (too
      # small) or behave like an unbatched DELETE (too large).
      batchSize: 5000
    # -- Maximum concurrent in-flight /evaluate calls to the audit
    # evaluator. Bound prevents an ingest spike from creating
    # unbounded concurrent reqwest futures + connection-pool waiters.
    # The broker's /metrics exposes broker_audit_inflight_available
    # so operators can spot saturation. The metrics doc suggests
    # bumping this value when the gauge sits at 0 (under sustained
    # load you'll see "evaluator round-trips queueing"). In-broker
    # default is 16 if unset; minimum is 1.
    inflightPermits: 16
    # -- Per-call timeout (in milliseconds) on the broker's POST to
    # the evaluator's /evaluate endpoint. 500ms is plenty for an
    # in-cluster evaluator (matcher is in-memory, sub-ms) but operators
    # running the evaluator across cells / regions / VPNs may need
    # more. Clamped to a minimum 50ms broker-side.
    evalTimeoutMs: 500

  # -- r2d2 connection-pool max_size. r2d2's own default is 10, which
  # is the bottleneck under heavy ingest: each audit evaluator
  # round-trip and each regular request handler needs a pool
  # connection. This MUST stay comfortably above audit.inflightPermits
  # (default 16): if the pool only equals the permit count, a burst of
  # audit evaluations can hold every connection and starve /health +
  # ingest inserts — /health then 503s, liveness kills the broker, and
  # it crash-loops (clients ECONNREFUSED → retry storm). The broker
  # enforces a floor of inflightPermits + 8 at startup (logging a warn
  # if it has to raise this), but the chart default ships safe: 32 with
  # the default 16 permits leaves 16 connections of headroom.
  # Tune up when broker logs show "could not get db conn for audit
  # verdict insert" warns or when /metrics shows pool-acquire stalls.
  dbPoolMaxSize: 32

  # -- Per-statement timeout (ms) applied to every broker DB connection as a
  # backstop: the broker runs as a single replica, so one slow or accidentally
  # unbounded query would otherwise tie up a connection/worker indefinitely and
  # can cascade into liveness-probe failures. Postgres kills any statement that
  # exceeds this. 0 disables it. Startup migrations (long CREATE INDEX builds)
  # are exempt. Healthy request queries are sub-second, so 30s is a safe ceiling
  # that only ever fires on pathological queries. Tune down for tighter SLOs.
  statementTimeoutMs: 30000

  # -- Total in-flight memory (MiB) the broker will commit to whole-result-set
  # reads (/pod/traffic, /pod/info, /svc/info, /audit/verdicts, ...). This is
  # what bounds concurrent heavy reads; dbPoolMaxSize does NOT — it was chosen
  # for DB contention and never referenced memory, which let 32 concurrent
  # 50 MiB reads be admitted into a 1Gi container and OOMKill it.
  # One /pod/traffic?limit=20000 peaks at ~50 MiB (measured byte-exact:
  # 1982 B/row of Rust heap + ~600 B/row of libpq PGresult). 256 MiB buys 5
  # concurrent hard-cap reads, or 20 concurrent default 5000-row reads.
  # Reads that don't fit are REFUSED with 503 + Retry-After, never truncated —
  # a short read would produce a policy with missing rules.
  # Raise this and resources.limits.memory together: the broker clamps the
  # budget to 30% of the limit and warns if you don't.
  # Watch broker_read_shed_total and broker_read_budget_kib_available.
  readMemoryBudgetMb: 256

  # -- How long a read queues for budget before being shed with 503 (ms).
  # 0 fails fast with no queueing. 5s rides out a burst (a hard-cap read
  # holds its budget ~1-3s) while failing inside a typical client timeout.
  readAcquireWaitMs: 5000

  # -- Number of attempts the broker makes to run embedded migrations
  # on startup, at 2s spacing. The chart's wait-for-db init container
  # handles "DB not started" via TCP probe — this loop absorbs the
  # gap between TCP-ready and postgres-accepting-queries (10-30s on
  # slow / small nodes during initdb). 10 attempts ≈ 20s budget. Bump
  # when broker crash-loops with "DB migration attempt N/10 failed"
  # before postgres finishes warming up. Min 1.
  dbMigrationMaxRetries: 10

  # -- Startup probe. Empty by default — opt in when slow startup is expected
  # (e.g. cold image pull on small nodes). Replaces the default startup probe.
  startupProbe: {}
  # Example:
  # startupProbe:
  #   httpGet: { path: /health, port: http }
  #   failureThreshold: 30
  #   periodSeconds: 10

  # -- Topology spread constraints applied to broker pods. Useful when running
  # multiple replicas across zones/nodes. See
  # https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints: []
  # Example:
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: kguardian-broker

  podDisruptionBudget:
    # -- Create a PodDisruptionBudget for the broker. Defaults to false; enable
    # when running >1 replica so voluntary evictions can't take all of them out.
    enabled: false
    # -- Either minAvailable or maxUnavailable can be set (not both).
    # Accepts integer or percentage string ("50%").
    minAvailable: 1
    maxUnavailable: ""

  # -- Optional bearer-token auth on the broker HTTP API. The broker API
  # is otherwise unauthenticated; enabling this requires every
  # controller / llm-bridge request to carry a shared secret, closing the
  # forged-row / unauthorized-read exposure for those server-to-server
  # paths. Opt-in (default false) for backward compatibility.
  #
  # NOTE: the frontend talks to the broker directly from the browser and
  # cannot safely hold a static token, so enabling auth does not cover
  # the frontend path — keep the frontend on a trusted network or front
  # the broker with an authenticating proxy for browser traffic.
  #
  # /health and /metrics stay open (kubelet probes + Prometheus can't send
  # the token). Provide the token yourself in a Secret (not generated by
  # the chart, so it's stable across upgrades):
  #   kubectl -n <ns> create secret generic kguardian-broker-auth \
  #     --from-literal=token="$(openssl rand -hex 32)"
  auth:
    enabled: false
    # -- Name of an existing Secret holding the shared token. REQUIRED
    # when enabled=true.
    existingSecret: ""
    # -- Key within that Secret.
    secretKey: token

  # -- Ingress NetworkPolicy for the broker. The broker HTTP API is
  # unauthenticated, so this restricts which in-cluster sources may reach
  # it (llm-bridge, frontend, the helm-test pod via podSelector; the
  # controller via allowedNodeCIDRs). Ingress-only — the broker's own
  # egress (DB, DNS, evaluator) is never restricted. Requires a
  # NetworkPolicy-enforcing CNI (Cilium, Calico, ...).
  #
  # OPT-IN (default false) on purpose: the controller is a hostNetwork
  # eBPF DaemonSet, so it posts to the broker from the NODE IP and a
  # podSelector can NEVER match it. Enabling the policy without listing
  # your node network in allowedNodeCIDRs will BLOCK the controller and
  # stall its rollout. Enable only after setting allowedNodeCIDRs.
  #
  # CAVEAT (validated on Cilium): the allowedNodeCIDRs ipBlock needed for
  # the hostNetwork controller is a coarse allow — on some CNIs (Cilium)
  # it also admits OTHER in-cluster pods, so this policy is defence-in-
  # depth, NOT airtight isolation. The pod clients (llm-bridge/frontend)
  # are precisely scoped via podSelector; the controller allowance is
  # not. For strict broker isolation prefer a CNI-native policy (e.g. a
  # CiliumNetworkPolicy using fromEntities: [host, remote-node]) or, the
  # real fix, authentication on the broker API.
  networkPolicy:
    enabled: false
    # -- Node network CIDR(s) the controller DaemonSet runs on. Required
    # when enabled=true, since the hostNetwork controller reaches the
    # broker from its node IP. e.g. ["10.0.0.0/16"] or per-node /32s.
    # On a dual-stack cluster list BOTH families — the controller reaches
    # the broker over whichever the node resolves first, so a v4-only
    # list silently blocks it on a v6-primary node. e.g.
    # ["10.0.0.0/16", "fd00::/64"].
    allowedNodeCIDRs: []
    # -- Extra ingress peers allowed to reach the broker HTTP port. The
    # /metrics endpoint shares that port, so when
    # broker.metrics.serviceMonitor.enabled is true, add your Prometheus
    # here. Each entry is a standard NetworkPolicyPeer.
    allowMetricsFrom: []
    # Example — allow a Prometheus running in the "monitoring" namespace:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: monitoring
    #     podSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: prometheus

  metrics:
    serviceMonitor:
      # -- Create a ServiceMonitor for prometheus-operator. The broker
      # exposes a Prometheus text-format /metrics endpoint with five
      # gauges/counter:
      #   broker_db_schema_ready, broker_db_reachable,
      #   broker_audit_enabled, broker_audit_inflight_available,
      #   broker_db_pool_idle, broker_db_pool_max,
      #   broker_uptime_seconds
      # Suggested alerts:
      #   - broker_db_schema_ready == 0 for 5m   → silent failure mode
      #   - broker_db_reachable == 0 for 1m      → DB connection issue
      #   - broker_audit_inflight_available == 0 for 10m → bump
      #     broker.audit.inflightPermits (default 16)
      #   - broker_db_pool_idle == 0 for 10m     → bump
      #     broker.dbPoolMaxSize (default 32)
      enabled: false
      # -- Endpoint path on the broker's HTTP service.
      path: /metrics
      # -- Service port name to scrape.
      port: http
      # -- Scrape interval.
      interval: 30s
      # -- Scrape timeout.
      scrapeTimeout: 10s
      # -- Extra labels to add to the ServiceMonitor (so prometheus-operator
      # picks it up — usually `release: kube-prometheus-stack`).
      labels: {}

  helmTest:
    # -- Render a `helm.sh/hook: test` Pod that probes the broker's
    # /health endpoint after install/upgrade. /health verifies schema
    # state (kguardian-dev/kguardian#876), so a passing test confirms
    # the broker can reach the database AND its migrations have run.
    # Run with `helm test <release>`.
    enabled: true

database:
  # -- Deploy the bundled in-cluster PostgreSQL. Set false to use an external
  # PostgreSQL — populate `database.external.host` and provide credentials via
  # `database.existingSecret`.
  enabled: true

  # -- PostgreSQL role used by the broker. Must exist on external Postgres.
  user: rust
  # -- Database name used by the broker. Must exist on external Postgres.
  databaseName: kube

  # -- Existing Secret containing the DB password under the key configured by
  # `database.passwordSecretKey`. When empty AND `database.enabled=true`, the
  # chart provisions a Secret named "kguardian-db-credentials" with a random
  # password (regenerated only on first install).
  existingSecret: ""
  # -- Secret data key holding the DB password.
  passwordSecretKey: password

  # External PostgreSQL connection. Used only when `database.enabled=false`.
  external:
    # -- Hostname or FQDN of the external PostgreSQL instance, e.g.
    # "postgres.databases.svc.cluster.local" or "db.example.com". Required
    # when `database.enabled=false`.
    host: ""
    # -- Port of the external PostgreSQL instance.
    port: 5432
    # -- libpq sslmode for the external connection (disable | allow | prefer
    # | require | verify-ca | verify-full). Cloud-managed Postgres typically
    # requires "require" or stricter.
    sslMode: prefer

  # -- Object name for the in-cluster Database deployment / PVC / SA. Only
  # used when `database.enabled=true`.
  name: kguardian-db
  image:
    # -- PostgreSQL container image repository
    repository: postgres
    # -- PostgreSQL image pull policy
    pullPolicy: IfNotPresent
    # -- PostgreSQL image tag (pinned; bump deliberately).
    # @breaking 18-alpine: PostgreSQL major-version data dirs are not
    # forward-compatible. Existing PG15 PersistentVolumeClaims must be
    # migrated with pg_upgrade or dropped before upgrading. See
    # charts/kguardian/UPGRADING.md.
    tag: "18-alpine"
    # -- Overrides the image tag using SHA digest
    sha: ""

  persistence:
    # -- Enable persistent storage for database. Defaults to true; set to false only for ephemeral testing.
    enabled: true
    # -- Use an existing PersistentVolumeClaim instead of creating a new one. When unset, the chart provisions a PVC named "{{ database.name }}-data".
    existingClaim: ""
    # -- Size of the auto-provisioned PVC (only used when existingClaim is unset)
    size: "10Gi"
    # -- StorageClass for the auto-provisioned PVC (only used when existingClaim is unset). Empty string uses the cluster's default StorageClass.
    storageClassName: ""
    # -- Refuse to start the database when the PVC contains an unrelated
    # PostgreSQL data directory (e.g. PG15 layout from before chart 1.10.0)
    # AND the current major's directory is empty. The default postgres
    # image would silently `initdb` over the empty location and the
    # operator would only notice once the schema came up empty.
    #
    # Set to false to bypass the check — for example, when intentionally
    # promoting from one major to another after running `pg_upgrade`
    # offline. See charts/kguardian/UPGRADING.md.
    safeBoot: true
    # -- Run a pg_dumpall as a Helm pre-upgrade/pre-rollback hook before
    # each chart upgrade. The dump is printed to the Job's stdout —
    # retrieve with `kubectl logs job/<database.name>-pre-upgrade-backup`
    # or pipe to your existing log-aggregation backup pipeline.
    #
    # Best-effort: a failed backup is logged but does NOT block the
    # upgrade. Set to false to skip entirely (e.g. for ephemeral test
    # deployments).
    preUpgradeBackup: true

  container:
    # -- PostgreSQL container port
    port: 5432

  # -- List of image pull secrets for private registries
  imagePullSecrets: []
  # -- Override the name of the database resources
  nameOverride: ""
  # -- Override the full name of the database resources
  fullnameOverride: ""

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- Automount API credentials for a service account
    automountServiceAccountToken: false

  # -- Annotations to add to database pods
  podAnnotations: {}

  # -- Database pod security context. Runs as postgres user (999)
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [999]
    seccompProfile:
      type: RuntimeDefault

  # -- Database container security context. Non-root with dropped capabilities
  securityContext:
    privileged: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false

  service:
    # -- Database service name
    name: "kguardian-db"
    # -- Database service type
    type: ClusterIP
    # -- Database service port
    port: 5432

  # -- Database pod resource requests and limits
  resources:
    limits:
      # cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    # -- Enable horizontal pod autoscaling for database
    enabled: false
    # -- Minimum number of database replicas
    minReplicas: 1
    # -- Maximum number of database replicas
    maxReplicas: 100
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Node labels for the kguardian database pod assignment
  nodeSelector:
    kubernetes.io/os: linux

  # -- Tolerations for the kguardian database pod assignment
  tolerations: []

  # -- Affinity rules for database pod assignment
  affinity: {}

  # -- Priority class to be used for the kguardian database pods
  priorityClassName: ""

frontend:
  # -- Number of frontend replicas to deploy
  replicaCount: 1
  image:
    # -- Frontend container image repository
    repository: ghcr.io/kguardian-dev/kguardian/frontend
    # -- Frontend image pull policy
    pullPolicy: IfNotPresent
    # -- Frontend version tag (auto-updated by release-please)
    tag: "1.15.0"
    # -- Overrides the image tag using SHA digest
    sha: ""

  container:
    # -- Frontend container port (serve)
    port: 5173

  # -- List of image pull secrets for private registries
  imagePullSecrets: []
  # -- Override the name of the frontend resources
  nameOverride: ""
  # -- Override the full name of the frontend resources
  fullnameOverride: ""

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- Automount API credentials for a service account
    automountServiceAccountToken: false

  # -- Annotations to add to frontend pods
  podAnnotations: {}

  # -- Frontend pod security context. Runs as non-root user (1337)
  podSecurityContext:
    runAsUser: 1337
    runAsGroup: 1337
    fsGroup: 1337
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [1337]
    seccompProfile:
      type: RuntimeDefault

  # -- Frontend container security context. Hardened with read-only root filesystem
  securityContext:
    privileged: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1337
    allowPrivilegeEscalation: false

  service:
    # -- Frontend service name
    name: "kguardian-frontend"
    # -- Frontend service type
    type: ClusterIP
    # -- Frontend service port
    port: 5173

  # -- Frontend pod resource requests and limits
  resources:
    limits:
      # cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

  autoscaling:
    # -- Enable horizontal pod autoscaling for frontend
    enabled: false
    # -- Minimum number of frontend replicas
    minReplicas: 1
    # -- Maximum number of frontend replicas
    maxReplicas: 100
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Node labels for the kguardian frontend pod assignment
  nodeSelector:
    kubernetes.io/os: linux

  # -- Tolerations for the kguardian frontend pod assignment
  tolerations: []

  # -- Affinity rules for frontend pod assignment
  affinity: {}

  # -- Priority class to be used for the kguardian frontend pods
  priorityClassName: ""

  # -- Startup probe. Empty by default — opt in when slow startup is expected.
  startupProbe: {}

  # -- Topology spread constraints applied to frontend pods.
  topologySpreadConstraints: []

  podDisruptionBudget:
    # -- Create a PodDisruptionBudget for the frontend. Defaults to false;
    # enable when running >1 replica.
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

  metrics:
    serviceMonitor:
      # -- Create a ServiceMonitor for prometheus-operator. The frontend
      # does not currently expose /metrics — forward-compatible toggle.
      enabled: false
      path: /metrics
      port: http
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

  ingress:
    # -- Enable ingress for frontend
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Also route /api on the same host to the Broker. The Broker serves
    # bare paths (/pod/info, /pod/traffic), so this only works behind an
    # ingress controller that strips the prefix, such as nginx with
    # rewrite-target. Controllers that pass the path through unchanged (AWS
    # ALB, for example) make every /api request a 404. The UI image proxies
    # /api to the Broker itself, so setting this to false serves the whole
    # application from the UI Service and works on any controller.
    apiPath: true
    # -- Ingress annotations
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    # -- Ingress hosts configuration
    hosts:
      - host: kguardian.example.com
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS configuration
    tls: []
    #  - secretName: kguardian-tls
    #    hosts:
    #      - kguardian.example.com

  # SSO (opt-in). For Gateway API environments with an identity-aware proxy
  # (oauth2-proxy -> OIDC, e.g. Dex/Keycloak/Authentik). When enabled the chart
  # renders an Envoy Gateway SecurityPolicy that gates your frontend HTTPRoute
  # via ext-auth, plus an /oauth2/* HTTPRoute to the proxy so the OIDC callback
  # and /oauth2/userinfo are same-origin (the frontend reads the signed-in user
  # from userinfo automatically — no rebuild). See charts/kguardian/UPGRADING.md.
  sso:
    # -- Gate the frontend behind SSO (renders a SecurityPolicy + /oauth2 route)
    enabled: false
    # -- Name of the HTTPRoute to protect (you or your gitops render the route)
    httpRouteName: ""
    # -- Hostnames for the /oauth2 auth-flow route — must match the app host
    hostnames: []
    #  - kguardian.example.com
    # -- Gateway parentRefs the /oauth2 route attaches to
    parentRefs: []
    #  - name: envoy-external
    #    namespace: network-system
    #    sectionName: https
    # -- The identity-aware proxy providing ext-auth + the /oauth2 endpoints
    oauth2Proxy:
      name: oauth2-proxy
      namespace: network-system
      port: 80
      # -- ext-auth check path on the proxy
      authPath: /oauth2/auth
    # -- Request headers the gateway forwards to the proxy for the auth check
    headersToExtAuth:
      - cookie
      - authorization
    # -- Identity headers the proxy injects back into the app after auth
    headersToBackend:
      - x-auth-request-user
      - x-auth-request-email
# AI assistant switch. The assistant is a single workload (llm-bridge) that
# runs the tools and the NetworkPolicy / seccomp generation in-process — the
# former mcp-server and advisor-serve components are retired. `ai.enabled`
# and the `llmBridge.enabled` flag are equivalent ways to turn it on. You must
# also create an LLM provider secret — see llmBridge.secrets.
ai:
  # -- Enable the AI assistant with one toggle. The assistant is a single
  # workload (llm-bridge) that runs the tools and policy/seccomp generation
  # in-process — no separate mcp-server or advisor-serve components.
  enabled: false
  # -- LLM provider for the assistant: one of "openai", "anthropic", "gemini",
  # "copilot". With `ai.secret` this is the one-line way to wire a provider —
  # the chart injects the right env var (OPENAI_API_KEY / ANTHROPIC_API_KEY /
  # GOOGLE_API_KEY / GITHUB_TOKEN) from your secret. Leave empty to configure
  # providers individually via llmBridge.secrets.* instead.
  provider: ""
  # -- Name of an existing Secret holding the provider API key under the key
  # `api-key` (override with llmBridge.secrets.keyName). Required when
  # `ai.provider` is set. Create it once:
  #   kubectl create secret generic my-llm-key --from-literal=api-key=sk-...
  secret: ""
  # -- Base URL of an OpenAI-compatible gateway (LiteLLM, vLLM, an enterprise
  # proxy) to call instead of the vendor's own API. Applies to whichever
  # provider `ai.provider` names. Empty = the vendor default.
  #
  # kguardian appends the provider's request path to this value VERBATIM and
  # never inserts, removes, or rewrites a `/v1` segment. That matters because
  # LiteLLM answers on both `/chat/completions` and `/v1/chat/completions`
  # while vLLM serves only the `/v1` form — so include `/v1` if your gateway
  # needs it. A wrong base fails as a 404/405 whose error names this value,
  # not as a silent fallback to the vendor API.
  #   baseUrl: http://litellm.litellm.svc.cluster.local:4000/v1
  #
  # YOU STILL NEED `ai.secret`. Provider availability is gated on the API key
  # alone, so setting `baseUrl` without `ai.secret` still reports "no provider
  # configured" and the assistant stays dark, however correct the URL is. Set
  # `ai.secret` to your gateway's virtual key, or to any non-empty dummy value
  # if the gateway is unauthenticated. This is the most common first-run
  # mistake.
  baseUrl: ""
  # -- Default model id the assistant asks the provider for. Empty = the
  # built-in default for `ai.provider` (gpt-4o / claude-opus-4-8 /
  # gemini-2.0-flash). Set this when pointing `ai.baseUrl` at a gateway whose
  # model ids are its own — "gpt-4o" means nothing to a gateway routing to a
  # local Llama, and the request fails model-not-found.
  #   model: my-team/llama-3.3-70b
  model: ""

  # External MCP endpoint. Serves kguardian's 12 tools over Model Context
  # Protocol (StreamableHTTP) at /mcp on the llm-bridge's existing port 8080,
  # so external MCP clients can query cluster telemetry and generate policies.
  # No extra Deployment, Service, or listener — just another route.
  mcp:
    # -- Serve the MCP endpoint at /mcp. When false the path is not routed at
    # all and 404s, so a disabled endpoint is indistinguishable from a build
    # that never had one.
    #
    # OFF by default. Enabled, it serves cluster telemetry — pod traffic,
    # syscalls, audit verdicts — with no LLM in the path and no per-tool
    # authorization.
    #
    # To be accurate about what this does and does not change: a workload
    # already inside the cluster can read that same data from the Broker
    # today, since `broker.auth.enabled` is false by default and the Broker's
    # API is a ClusterIP Service too. Turning /mcp on does not newly expose
    # anything to a compromised pod. What it adds is a path for that data to
    # leave the cluster — /mcp exists to be consumed from a workstation over
    # `kubectl port-forward`, by a client whose config may be shared or
    # committed. That is the exposure the token is for.
    #
    # It is off by default, and authenticated by default, because this is a
    # new endpoint with no existing users: the strict default costs nobody a
    # migration today and could not be introduced later without breaking
    # people.
    enabled: false
    auth:
      # -- Name of an existing Secret holding the shared bearer token.
      # REQUIRED when `ai.mcp.enabled=true` unless you explicitly set
      # `allowUnauthenticated` below — the chart refuses to render an
      # unauthenticated MCP endpoint by accident. Create it once:
      #   kubectl create secret generic kguardian-mcp-token \
      #     --from-literal=token="$(openssl rand -hex 32)"
      # Clients then send `Authorization: Bearer <token>`.
      existingSecret: ""
      # -- Key within that Secret.
      secretKey: token
      # -- Serve /mcp with NO authentication. Every caller that can reach the
      # Service gets unrestricted read access to your cluster's telemetry.
      #
      # This exists as an explicit, reviewable opt-out rather than the chart
      # silently allowing it, and rather than the chart forbidding it
      # outright: if you front llm-bridge with a default-deny NetworkPolicy
      # or a mesh with mTLS, the bearer token is genuinely redundant and
      # refusing to render would be the chart overruling you about your own
      # cluster. Setting it to true makes that judgement visible in your
      # values file and in code review, which a missing token never is.
      #
      # Note the failure is loud: `helm template` errors, so with a GitOps
      # controller the whole release stops reconciling, not just llm-bridge.
      # That is deliberate for a config you have just written, but it is why
      # the error names both remedies.
      allowUnauthenticated: false
    # -- Per-IP request ceiling for /mcp, in requests per minute. Empty = the
    # bridge's default of 300. Sized far above the chat route's 20/min
    # because one MCP client session is many round-trips — an agent walking
    # pods -> traffic -> verdicts -> policy burns 30-60 calls in seconds.
    # The counter is per-replica (in-memory store), so with the default
    # replicaCount of 2 the cluster-wide ceiling is roughly double this. It
    # is a runaway-client guard, not a quota. A non-numeric or non-positive
    # value is ignored by the bridge in favour of the default.
    rateLimitPerMin: ""

llmBridge:
  # -- Enable LLM Bridge service for AI assistant (or use ai.enabled to turn on the whole path)
  enabled: false
  # -- Number of llm-bridge replicas to deploy
  replicaCount: 2
  image:
    # -- LLM Bridge container image repository
    repository: ghcr.io/kguardian-dev/kguardian/llm-bridge
    # -- LLM Bridge image pull policy
    pullPolicy: IfNotPresent
    # -- LLM Bridge version tag (auto-updated by release-please)
    tag: "1.9.1"
    # -- Overrides the image tag using SHA digest
    sha: ""

  container:
    # -- LLM Bridge container port
    port: 8080

  # -- List of image pull secrets for private registries
  imagePullSecrets: []
  # -- Override the name of the llm-bridge resources
  nameOverride: ""
  # -- Override the full name of the llm-bridge resources
  fullnameOverride: ""

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- Automount API credentials for a service account
    automountServiceAccountToken: false

  # -- Annotations to add to llm-bridge pods
  podAnnotations: {}

  # -- LLM Bridge pod security context. Runs as non-root user (node:1000)
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [1000]
    seccompProfile:
      type: RuntimeDefault

  # -- LLM Bridge container security context. Hardened with read-only root filesystem
  securityContext:
    privileged: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

  service:
    # -- LLM Bridge service name
    name: "kguardian-llm-bridge"
    # -- LLM Bridge service type
    type: ClusterIP
    # -- LLM Bridge service port
    port: 8080

  # -- LLM Bridge pod resource requests and limits
  resources:
    limits:
      # cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    # -- Enable horizontal pod autoscaling for llm-bridge
    enabled: false
    # -- Minimum number of llm-bridge replicas
    minReplicas: 2
    # -- Maximum number of llm-bridge replicas
    maxReplicas: 10
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Node labels for the kguardian llm-bridge pod assignment
  nodeSelector:
    kubernetes.io/os: linux

  # -- Tolerations for the kguardian llm-bridge pod assignment
  tolerations: []

  # -- Affinity rules for llm-bridge pod assignment
  affinity: {}

  # -- Priority class to be used for the kguardian llm-bridge pods
  priorityClassName: ""

  # -- Startup probe. Empty by default — opt in when slow startup is expected.
  startupProbe: {}

  # -- Topology spread constraints applied to llm-bridge pods.
  topologySpreadConstraints: []

  podDisruptionBudget:
    # -- Create a PodDisruptionBudget for the llm-bridge. Defaults to false;
    # enable when running >1 replica.
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

  metrics:
    serviceMonitor:
      # -- Create a ServiceMonitor for prometheus-operator. llm-bridge does
      # not currently expose /metrics — forward-compatible toggle.
      enabled: false
      path: /metrics
      port: http
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

  # -- Additional environment variables for llm-bridge
  env: []

  # LLM Provider secrets configuration
  # Each provider uses its own secret with a normalized key name 'api-key'
  secrets:
    # -- Normalized secret key name used for all providers
    keyName: "api-key"

    # OpenAI configuration
    openai:
      # -- Enable OpenAI provider
      enabled: false
      # -- Secret name for OpenAI
      name: "kguardian-openai"

    # Anthropic configuration
    anthropic:
      # -- Enable Anthropic Claude provider
      enabled: false
      # -- Secret name for Anthropic
      name: "kguardian-anthropic"

    # Google Gemini configuration
    gemini:
      # -- Enable Google Gemini provider
      enabled: false
      # -- Secret name for Gemini
      name: "kguardian-gemini"

    # GitHub Copilot configuration
    copilot:
      # -- Enable GitHub Copilot provider
      enabled: false
      # -- Secret name for GitHub Copilot
      name: "kguardian-copilot"

# -------------------------------------------------------------------------
# kguardian-evaluator: watches AuditNetworkPolicy CRDs and reports flows
# that *would* be denied. No traffic is ever blocked. See
# docs/concepts/audit-network-policy.mdx for the design.
# -------------------------------------------------------------------------
evaluator:
  # -- Deploy the audit-mode policy evaluator. When false, the evaluator
  # workload, RBAC, Service, and PDB/ServiceMonitor are skipped. The CRD
  # itself ships in charts/kguardian/crds/ and is always installed by
  # Helm regardless of this toggle.
  #
  # The evaluator is now published at ghcr.io/kguardian-dev/kguardian/evaluator
  # and on by default. Set to false to skip the workload while still
  # installing the AuditNetworkPolicy CRD (e.g. for shared-cluster setups
  # where the evaluator runs elsewhere).
  enabled: true

  # -- Number of evaluator replicas
  replicaCount: 1

  image:
    # -- Evaluator container image repository
    repository: ghcr.io/kguardian-dev/kguardian/evaluator
    # -- Evaluator image pull policy
    pullPolicy: IfNotPresent
    # -- Evaluator version tag (auto-updated by release-please)
    tag: "v0.4.0"
    # -- Overrides the image tag using SHA digest
    sha: ""

  # -- Log level for the evaluator process (panic|fatal|error|warn|info|debug|trace)
  logLevel: info

  # -- Additional environment variables for the evaluator
  env: []

  container:
    # -- Evaluator HTTP port
    port: 8082

  service:
    # -- Evaluator service name
    name: "kguardian-evaluator"
    # -- Evaluator service type
    type: ClusterIP
    # -- Evaluator service port
    port: 8082

  # -- List of image pull secrets for private registries
  imagePullSecrets: []

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use
    name: ""
    # -- Automount API credentials (the evaluator must reach the API server
    # to watch CRDs, pods, and namespaces)
    automountServiceAccountToken: true

  # -- Annotations to add to evaluator pods
  podAnnotations: {}

  # -- Evaluator pod security context. Runs as non-root user (1000)
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [1000]
    seccompProfile:
      type: RuntimeDefault

  # -- Evaluator container security context. Hardened with read-only root filesystem
  securityContext:
    privileged: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

  # -- Evaluator pod resource requests and limits
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  autoscaling:
    # -- Enable horizontal pod autoscaling for evaluator
    enabled: false
    # -- Minimum number of evaluator replicas
    minReplicas: 1
    # -- Maximum number of evaluator replicas
    maxReplicas: 5
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80

  # -- Node labels for evaluator pod assignment
  nodeSelector:
    kubernetes.io/os: linux

  # -- Tolerations for evaluator pod assignment
  tolerations: []

  # -- Affinity rules for evaluator pod assignment
  affinity: {}

  # -- Priority class to be used for the kguardian evaluator pods
  priorityClassName: ""

  # -- Startup probe. Empty by default — opt in when slow startup is expected.
  startupProbe: {}

  # -- Topology spread constraints applied to evaluator pods.
  topologySpreadConstraints: []

  podDisruptionBudget:
    # -- Create a PodDisruptionBudget for the evaluator. Defaults to false;
    # enable when running >1 replica.
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

  metrics:
    serviceMonitor:
      # -- Create a ServiceMonitor for prometheus-operator. The evaluator
      # does not currently expose /metrics natively — forward-compatible
      # toggle for when it does.
      enabled: false
      path: /metrics
      port: http
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
