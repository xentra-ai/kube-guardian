[package]
name = "broker"
version = "1.17.1"  #:version
authors = ["Mahesh Rayas"]
description = """
API server for kguardian - stores telemetry data from eBPF controller
"""
documentation = "https://github.com/kguardian-dev/kguardian"
homepage = "https://github.com/kguardian-dev/kguardian"
repository = "https://github.com/kguardian-dev/kguardian"
readme = "README.md"
keywords = ["kubernetes", "k8s"]
license = "BUSL-1.1"
edition = "2021"

[[bin]]
name = "broker"
path = "src/main.rs"

[lib]
name = "api"
path = "src/lib.rs"
bench = false

[dependencies]
dotenv = "0.15"
actix-web = "4.11"
actix-cors = "0.7"
diesel = { version = "2.3.6", features = ["postgres","chrono","serde_json","r2d2","64-column-tables"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
thiserror = "2.0.18"
tracing = {version = "0.1.44", features = ['log']}
chrono = { version = "0.4.43", features = ["serde"] }
diesel_migrations = "2.1.0"
tracing-subscriber = { version = "0.3.22", features = ["json", "env-filter"] }
# "rustls" (renamed from 0.12's "rustls-tls") adds the TLS backend for the
# outbound HTTPS version check-in (version_check.rs); in-cluster calls
# (evaluator) remain plain http.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
# "sync" (Semaphore) and "time" (timeout) back the read-memory budget in
# read_budget.rs. Both were previously reaching us only via actix-rt's own
# feature selection — relying on another crate's features for a memory-safety
# bound is a build that breaks on someone else's dependency bump, so they are
# declared here explicitly.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
# Used in unit tests to exercise the same query-string parsing path
# that actix-web's web::Query goes through internally, without
# depending on a running web::App / TestServer.
serde_urlencoded = "0.7"